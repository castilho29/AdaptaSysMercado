<style>

.ov{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.md{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:560px;box-shadow:0 20px 60px #0006}.md.wide{max-width:900px}
.mb{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:var(--tx);color:var(--card);padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px #0005;max-width:90vw}

.drop{border:2px dashed var(--bd);border-radius:14px;padding:26px;text-align:center;color:var(--mu)}
.drop.on{border-color:var(--ac);background:var(--ac2)}
td input,td select{padding:6px 8px;font-size:13.5px}
.ckl{display:flex;align-items:center;gap:10px;margin:10px 0;font-weight:600;color:var(--tx);cursor:pointer}.ckl input{width:20px;height:20px}
.bar .ckl{flex:0 0 auto;font-size:14px}.bar .ckl input{flex:0 0 auto;min-width:0;width:18px;height:18px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chips button{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:7px 14px;font-weight:650;color:var(--tx)}.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.ped{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:10px}.ped.novo{border-color:var(--yl);box-shadow:inset 4px 0 0 var(--yl)}
.ped .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.ped .top b{font-size:16px}.ped .vt{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.ped .its{margin:8px 0;color:var(--tx)}.ped .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.horT td,.horT th{padding:4px 6px}.horT .hsel{padding:6px;min-width:92px}.horT select:disabled{opacity:.35}
.alarme{display:flex;align-items:center;gap:10px;background:var(--yl);color:#1B2433;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:700}.alarme .sp{flex:1}

.tx{display:grid;grid-template-columns:1fr 130px 40px;gap:8px;margin-bottom:6px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.tabs{flex-direction:row;overflow:auto;position:static}.g4,.g3{grid-template-columns:1fr 1fr}}

/* menu em grupos, sub-telas de Configurações, Início e correções visuais */
.tabs .tg{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:12px 12px 2px}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;padding:6px;background:var(--card);border:1px solid var(--bd);border-radius:14px;position:sticky;top:72px;z-index:5}
.subnav button{border:0;background:none;padding:8px 11px;border-radius:10px;font:inherit;font-weight:700;color:var(--tx);cursor:pointer;white-space:nowrap}
.subnav button:hover{background:var(--ac2)}.subnav button.on{background:var(--ac);color:#fff}
.salvabar{position:sticky;bottom:0;z-index:4;display:flex;gap:12px;align-items:center;justify-content:flex-end;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin-top:6px;box-shadow:0 -6px 18px rgba(15,23,42,.08)}
.aviso{margin:8px 0;padding:10px 12px;border-radius:12px;background:#FFF4E5;color:#8A4B00;font-weight:600;border:1px solid #F5C77E}
input[type=checkbox],input[type=radio]{width:20px;height:20px;padding:0;flex:none;margin:0;vertical-align:middle}
label.ck{display:flex;align-items:center;gap:10px;margin:10px 0;cursor:pointer;font-weight:600;color:var(--tx)}
.ini2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.al{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;margin:6px 0;font-weight:600}
.al.wn{background:#FFF4E5;color:#8A4B00}.al.rd{background:#FDECEC;color:#A4262C}
.barras{display:flex;gap:8px;align-items:flex-end;height:170px;padding-top:6px}
.bx{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bx i{display:block;width:100%;max-width:44px;background:var(--ac2);border-radius:8px 8px 3px 3px}.bx i.hj{background:var(--ac)}
.bv{font-size:11.5px;font-weight:700;color:var(--mu)}.bl{font-size:12px;color:var(--mu);white-space:nowrap}
.prog{height:8px;background:var(--bg);border-radius:8px;margin:10px 0 12px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);border-radius:8px}
.ckg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.cki{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--bd);background:var(--card);border-radius:12px;padding:10px 12px;font:inherit;font-weight:600;color:var(--tx);cursor:pointer}.cki.ok{color:var(--mu);border-style:dashed}.cki:hover{border-color:var(--ac)}
.arq{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}.arq input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.arq .nm{color:var(--mu);font-size:14px}

/* ===== tema claro (padrão) ===== */
:root{color-scheme:light;--bg:#F6F8FB;--card:#FFFFFF;--tx:#1B2433;--mu:#6B778A;--bd:#E3E8EF;--ln:#EEF1F5;--ac:#1E4FD8;--ac-h:#1843BC;--ac2:#EEF3FF;--b1:#1E4FD8;--b2:#1E4FD8;--ok:#18A058;--ok2:#E8F6EE;--rd:#D9363E;--rd2:#FDECEC;--wn:#9A5B00;--wn2:#FFF4DC;--row:#FAFBFD;--yl:#FFC629}
body{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.b{background:var(--ac);font-weight:650;transition:background .12s}.b:hover{filter:none;background:var(--ac-h)}
.b.s{background:#fff;color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd)}.b.s:hover{background:var(--ac2)}
.b.ok{background:var(--ok)}.b.rd{background:var(--rd)}.b.gh{background:transparent;color:var(--mu)}.b.gh:hover{background:var(--ln);color:var(--tx)}
.b:focus-visible,input:focus-visible{outline:3px solid rgba(30,79,216,.35);outline-offset:2px}
.hd{height:64px;padding:8px 20px}.hd .nm{font-weight:750;letter-spacing:-.01em}
.chip{background:#fff}
.tabs button{font-weight:600;color:var(--tx)}.tabs button:hover{background:#EEF1F5}
.tabs button.on{background:#fff;color:var(--ac);box-shadow:inset 3px 0 0 var(--yl),0 0 0 1px var(--bd)}
.card{border-radius:14px}
h2{font-weight:750;letter-spacing:-.015em}
th{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:650}
td{border-bottom-color:var(--ln)}
.kpis small{font-weight:650}.kpis b{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;font-weight:750;letter-spacing:-.01em}
.ov{background:rgba(27,36,51,.32)}.md{border-radius:18px;box-shadow:0 24px 64px rgba(27,36,51,.18)}
.toast{background:#1B2433;color:#fff}
.drop{border-color:#CDD6E3;background:#FBFCFE}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.b:active{background:var(--ac-h)}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--ac)}

/* ===== temas: cartões, letras e cantos seguem o tema escolhido ===== */
.hd,.card,.md,.chip,.ib,.rel,.rap button,.sw button,.scan input,.b.s,.pk,.tw{background:var(--card)}
.tabs button:hover{background:var(--ac2)}
.b.s,.b.s kbd,.b.gh kbd,kbd{color:var(--tx)}
kbd,.b.s kbd,.b.gh kbd{background:var(--ln);border-color:var(--bd);color:var(--mu)}
input,select,textarea{background:var(--card);color:var(--tx)}
.rap .ft{background:var(--ln)}
.etq,.etq b{color:var(--ylt)}
.card,.rap button,.b,.scan input,.rel{border-radius:var(--rad)}
h1,h2,h3,.hd .nm,.etq b,.rel>b,.last .lt,.tr{font-family:var(--fh)}
tbody tr:hover td{background:var(--row)}
.escuro .b:disabled{background:#2A3240;color:#6E7A8C}
.escuro .ov{background:rgba(0,0,0,.55)}
.escuro .b.s:hover,.escuro .rap button:hover{background:var(--ac2)}
.escuro img[src*="logo"]{background:#fff;border-radius:8px}
/* topo: botões com ícone e nome */
.hb{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:var(--rad);border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;font-size:14.5px;position:relative;white-space:nowrap}
.hb svg{width:22px;height:22px;flex:none;color:var(--ac)}
.hb:hover{background:var(--ac2);border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}
.hb.on{background:var(--ac);border-color:var(--ac);color:#fff}.hb.on svg{color:#fff}
.hb .bd{background:var(--rd);color:#fff;border-radius:11px;padding:0 7px;font-size:12.5px;line-height:20px;min-width:20px;text-align:center}
.hb.on .bd{background:#fff;color:var(--ac)}
.hb.sai svg{color:var(--mu)}
@media(max-width:1250px){.hb span{display:none}.hb{padding:0 11px}}
/* escolha de tema */
.sw{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))!important}
.sw button{padding:6px!important;gap:6px!important}
.sw .pv{width:100%;height:54px;border-radius:8px;padding:6px;display:grid;grid-template-columns:1fr 34%;gap:4px;border:1px solid rgba(0,0,0,.08)}
.sw .pv i{border-radius:4px;display:block}.sw .pv .c{grid-row:span 2}
.sw b{font-size:13px}.swg{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 2px}
.sw button{border:2px solid var(--bd);border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font:inherit;color:var(--tx)}.sw button.on{border-color:var(--tx)}.sw{display:grid;gap:8px;margin:6px 0 4px}
.opg{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))!important;gap:12px!important;margin-top:12px}
.opg .b{min-height:96px!important;font-size:21px!important;flex-direction:column;gap:4px}
.opg .b small{display:block;font-size:13px;font-weight:600;color:var(--mu)}
.mots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 8px}
.mots button{min-height:52px;padding:8px 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:15px;font-weight:650;text-align:left;cursor:pointer}
.mots button:hover{border-color:var(--ac)}.mots button.on{background:var(--ac);border-color:var(--ac);color:#fff}.mots button.out{color:var(--mu)}.mots button.out.on{color:#fff}
.emb .hd{display:none}.emb .wrap{min-height:100vh}.emb .tabs{top:12px}
.segm{display:inline-flex;border:1.5px solid var(--bd);border-radius:10px;overflow:hidden}.segm button{border:0;background:var(--card);color:var(--tx);padding:7px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-height:0}.segm button.on{background:var(--ac);color:#fff}

/* quantas unidades vêm em cada caixa/fardo/display/cartela da nota?
   1º) a própria nota (unidade tributável: CX 2 → UN 24)   2º) a unidade da nota com número (CX12, DP24)
   3º) o NOME do produto: "CART C/12", "DISPLAY 24UN", "FD 6X1L", "12X500G", "C/27", "30 OVOS", "DUZIA"...
   A lista de siglas segue a tabela padrão de unidades comerciais da NF-e e as abreviações comuns dos atacados. */

  ['pacote','PCT|PCTE|PCTS|PAC|PACOTE|PACOTES|PK|PACK'],['shrink','SH|SHR|SHRINK|TERMO|TERMOPACK'],['embalagem','EMB|EMBAL|EMBALAGEM'],['bandeja','BD|BDJ|BAND|BANDEJ|BANDEJA|TRAY'],['saco','SC|SACO|SACOS|SACA|SACOLA'],
  ['engradado','ENG|ENGR|ENGRADADO|GRADE'],['pote','POTE'],['balde','BALDE'],['kit','KIT|CJ|CONJ|CONJUNTO|JG|JOGO'],['dúzia','DZ|DUZIA'],['cento','CENTO'],['milheiro','MIL|MILHEIRO']];
const PKGRE=PKG.map(([t,w])=>[t,new RegExp('^(?:'+w+')$')]);
const tipoDe=w=>{w=String(w||'').toUpperCase().replace(/[^A-Z]/g,'');const r=PKGRE.find(([,re])=>re.test(w));return r?r[0]:''};
const EMBU={test:u=>{const t=tipoDe(String(u||'').replace(/\d+$/,''));return !!t&&t!='kit'&&t!='pote'&&t!='balde'}};
const PKW=PKG.filter(([t])=>!['pote','balde','dúzia','cento','milheiro'].includes(t)).map(x=>x[1]).join('|');
const MED='G|GR|GRS|GRAMAS|KG|KGS|MG|ML|L|LT|LTS|LITRO|LITROS|M|MT|MTS|CM|MM|W|V|OZ|CC';
const CONT='UN|UND|UNDS|UNID|UNIDS|UNIDADE|UNIDADES|U|PC|PCS|PECA|PECAS|PCT|PCTS|PACOTES|SACHE|SACHES|SACHET|SACHETS|ENVELOPES|ROLOS|RL|BARRAS|LATAS|GARRAFAS|POTES|TABLETES|TABLETS|ITENS|CAIXINHAS|SAQUINHOS|FRASCOS|TUBOS|BISNAGAS|BOMBONS|PIRULITOS|CHICLETES|BALAS|PARES|OVOS';

const RE_NXM=new RegExp('(?:^|[^\\d.,])(\\d{1,3})\\s*X\\s*\\d+(?:[.,]\\d+)?\\s*(?:'+MED+'|'+CONT+')\\b');
const RE_MXN=new RegExp('\\d+(?:[.,]\\d+)?\\s*(?:'+MED+')\\s*X\\s*(\\d{1,3})\\b');
const RE_CN=new RegExp('(?:\\bC\\s*\\/|\\bCOM\\s+|\\bCONTEM\\s+|\\bCONT\\.?\\s*)\\s*(\\d{1,4})(?![\\d.,])\\s*([A-Z]+)?');
const RE_CW=new RegExp('^(?:'+CONT+'|'+PKW+')$');
const fem=t=>['caixa','cartela','embalagem','bandeja','dúzia'].includes(t);
const RE_NUN=new RegExp('\\b(\\d{1,4})\\s*(?:'+CONT+')\\b');
function detFator(x,uCom,qCom,uTrib,qTrib,vUn){const d=detFator0(x,uCom,qCom,uTrib,qTrib);
  if(d&&d.emb&&!d.nota&&+vUn>0&&vUn/d.f<0.08){d.emb=false;d.por+=' · sairia a '+'R$ '+(vUn/d.f).toFixed(3).replace('.',',')+' a unidade, deixei fechado'}return d}
function detFator0(x,uCom,qCom,uTrib,qTrib){
  const ok=n=>n>1&&n<=2000&&Math.abs(n-Math.round(n))<0.001,U=String(uCom||'').toUpperCase().trim(),tU=tipoDe(U.replace(/\d+$/,''));
  const R=(f,por,emb,tipo)=>({f:Math.round(f),por,emb:!!emb,tipo:tipo||tU||'embalagem'});
  if(uTrib&&qCom>0&&qTrib>0&&uTrib.toUpperCase()!=U&&!/^(KG|G|GR|L|LT|ML|M|M2|M3)$/i.test(uTrib)){const r=qTrib/qCom;if(ok(r))return {...R(r,'a nota diz '+N(qCom)+' '+uCom+' = '+N(qTrib)+' '+uTrib,true),nota:true}}
  let m=U.match(/^([A-Z]+)\s*(\d{1,4})$/);if(m&&tipoDe(m[1])&&ok(+m[2]))return R(+m[2],'unidade da nota "'+U+'"',true,tipoDe(m[1]));
  const t=' '+String(x||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'')+' ';
  if((m=t.match(RE_PKGN))&&ok(+m[2])){const tp=tipoDe(m[1]);return R(+m[2],'"'+m[0].trim()+'" no nome',tp!='kit',tp)}
  if((m=t.match(RE_NXM))&&ok(+m[1]))return R(+m[1],'"'+m[0].trim()+'" no nome',EMBU.test(U));
  if((m=t.match(RE_MXN))&&ok(+m[1]))return R(+m[1],'"'+m[0].trim()+'" no nome',EMBU.test(U));
  if((m=t.match(RE_CN))&&ok(+m[1])&&(!m[2]||RE_CW.test(m[2])))return R(+m[1],'"'+m[0].trim()+'" no nome',EMBU.test(U));
  if((m=t.match(RE_NUN))&&ok(+m[1]))return R(+m[1],'"'+m[0].trim()+'" no nome',EMBU.test(U));
  if(/\bMEIA\s+DUZIA\b/.test(t))return R(6,'"meia dúzia" no nome',EMBU.test(U)||tU=='dúzia','dúzia');
  if(/\b(DUZIA|DZ)\b/.test(t)||tU=='dúzia')return R(12,'vem por dúzia',true,'dúzia');
  if(/\bCENTO\b/.test(t)||tU=='cento')return R(100,'vem por cento',true,'cento');

}

function qrMatrix(text){
  const data=Array.from(new TextEncoder().encode(text));
  const T=[null,[10,[[1,16]]],[16,[[1,28]]],[26,[[1,44]]],[18,[[2,32]]],[24,[[2,43]]],[16,[[4,27]]],[18,[[4,31]]],[22,[[2,38],[2,39]]],[22,[[3,36],[2,37]]],[26,[[4,43],[1,44]]],[30,[[1,50],[4,51]]],[22,[[6,36],[2,37]]],[22,[[8,37],[1,38]]],[24,[[4,40],[5,41]]]];
  const AP=[null,[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50],[6,30,54],[6,32,58],[6,34,62],[6,26,46,66]];
  let v=1;for(;v<=14;v++){const cap=T[v][1].reduce((s,[k,d])=>s+k*d,0);if(4+(v<10?8:16)+data.length*8<=cap*8)break}
  if(v>14)return null;
  const [ecn,blk]=T[v],total=blk.reduce((s,[k,d])=>s+k*d,0);
  const bb=[],put=(val,len)=>{for(let i=len-1;i>=0;i--)bb.push((val>>i)&1)};
  put(4,4);put(data.length,v<10?8:16);data.forEach(b=>put(b,8));
  put(0,Math.min(4,total*8-bb.length));while(bb.length%8)bb.push(0);
  const cw=[];for(let i=0;i<bb.length;i+=8)cw.push(parseInt(bb.slice(i,i+8).join(''),2));
  for(let p=0;cw.length<total;p^=1)cw.push(p?0x11:0xEC);
  const exp=[],log=[];let x=1;
  for(let i=0;i<255;i++){exp[i]=x;log[x]=i;x<<=1;if(x&256)x^=0x11D}
  for(let i=255;i<512;i++)exp[i]=exp[i-255];
  const mul=(a,b)=>a&&b?exp[log[a]+log[b]]:0;
  let g=[1];
  for(let i=0;i<ecn;i++){const ng=new Array(g.length+1).fill(0);for(let j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=mul(g[j],exp[i])}g=ng}
  const rs=d=>{const r=new Array(ecn).fill(0);for(const b of d){const f=b^r[0];r.shift();r.push(0);if(f)for(let j=0;j<ecn;j++)r[j]^=mul(g[j+1],f)}return r};
  const blocks=[];let p0=0;
  for(const [k,d] of blk)for(let i=0;i<k;i++){blocks.push(cw.slice(p0,p0+d));p0+=d}
  const ecs=blocks.map(rs),out=[],maxd=Math.max(...blocks.map(b=>b.length));
  for(let i=0;i<maxd;i++)blocks.forEach(b=>{if(i<b.length)out.push(b[i])});
  for(let i=0;i<ecn;i++)ecs.forEach(e=>out.push(e[i]));
  const fb=[];out.forEach(b=>{for(let i=7;i>=0;i--)fb.push((b>>i)&1)});
  const n=17+4*v,M=Array.from({length:n},()=>new Array(n).fill(0)),F=Array.from({length:n},()=>new Array(n).fill(false));
  const set=(r,c,val)=>{M[r][c]=val?1:0;F[r][c]=true};
  const finder=(r0,c0)=>{for(let dr=-1;dr<=7;dr++)for(let dc=-1;dc<=7;dc++){const r=r0+dr,c=c0+dc;if(r<0||c<0||r>=n||c>=n)continue;set(r,c,dr>=0&&dr<=6&&dc>=0&&dc<=6&&(dr==0||dr==6||dc==0||dc==6||(dr>=2&&dr<=4&&dc>=2&&dc<=4)))}};
  finder(0,0);finder(0,n-7);finder(n-7,0);
  for(let i=8;i<n-8;i++){set(6,i,i%2==0);set(i,6,i%2==0)}
  const ap=AP[v],last=ap[ap.length-1];
  for(const r of ap)for(const c of ap){if((r==6&&c==6)||(r==6&&c==last)||(r==last&&c==6))continue;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++)set(r+dr,c+dc,Math.max(Math.abs(dr),Math.abs(dc))!=1)}
  for(let i=0;i<9;i++){if(i!=6){F[8][i]=true;F[i][8]=true}}
  for(let i=0;i<8;i++){F[8][n-1-i]=true;F[n-1-i][8]=true}
  set(n-8,8,1);
  if(v>=7){for(let i=0;i<6;i++)for(let j=0;j<3;j++){F[i][n-11+j]=true;F[n-11+j][i]=true}}
  let bi=0;
  for(let c=n-1,up=true;c>0;c-=2,up=!up){if(c==6)c=5;for(let i=0;i<n;i++){const r=up?n-1-i:i;for(let k=0;k<2;k++){const cc=c-k;if(!F[r][cc])M[r][cc]=bi<fb.length?fb[bi++]:0}}}
  const maskFn=[(r,c)=>(r+c)%2==0,(r,c)=>r%2==0,(r,c)=>c%3==0,(r,c)=>(r+c)%3==0,(r,c)=>(Math.floor(r/2)+Math.floor(c/3))%2==0,(r,c)=>(r*c)%2+(r*c)%3==0,(r,c)=>((r*c)%2+(r*c)%3)%2==0,(r,c)=>(((r+c)%2)+(r*c)%3)%2==0];
  const withMask=mk=>{
    const m=M.map(row=>row.slice());
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(!F[r][c]&&maskFn[mk](r,c))m[r][c]^=1;
    let rem=mk<<10;for(let i=14;i>=10;i--)if((rem>>i)&1)rem^=0x537<<(i-10);
    const bits=((mk<<10)|rem)^0x5412,b=i=>(bits>>i)&1;
    for(let i=0;i<=5;i++)m[i][8]=b(i);
    m[7][8]=b(6);m[8][8]=b(7);m[8][7]=b(8);
    for(let i=9;i<15;i++)m[8][14-i]=b(i);
    for(let i=0;i<8;i++)m[8][n-1-i]=b(i);
    for(let i=8;i<15;i++)m[n-15+i][8]=b(i);
    m[n-8][8]=1;
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>11)*0x1F25);const vb=(v<<12)|r;for(let i=0;i<18;i++){const bit=(vb>>i)&1,a=n-11+i%3,q=Math.floor(i/3);m[q][a]=bit;m[a][q]=bit}}
    return m;
  };
  const penalty=m=>{
    let pen=0,dark=0;
    const line=get=>{let run=1,prev=get(0),s=''+prev;for(let i=1;i<n;i++){const cur=get(i);s+=cur;if(cur==prev)run++;else{if(run>=5)pen+=3+run-5;run=1;prev=cur}}if(run>=5)pen+=3+run-5;for(let i=0;i+11<=n;i++){const w=s.substr(i,11);if(w=='10111010000'||w=='00001011101')pen+=40}};
    for(let r=0;r<n;r++){line(i=>m[r][i]);line(i=>m[i][r]);for(let c=0;c<n;c++){dark+=m[r][c];if(r<n-1&&c<n-1&&m[r][c]==m[r][c+1]&&m[r][c]==m[r+1][c]&&m[r][c]==m[r+1][c+1])pen+=3}}
    pen+=(Math.ceil(Math.abs(dark*20-n*n*10)/(n*n))-1)*10;return pen;
  };
  let best=null,bp=1e9;for(let mk=0;mk<8;mk++){const m=withMask(mk),pn=penalty(m);if(pn<bp){bp=pn;best=m}}
  return best;
}
function qrSvg(q){const n=q.length,mg=4;let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q[r][c])d+=`M${c+mg} ${r+mg}h1v1h-1z`;return `<svg viewBox="0 0 ${n+2*mg} ${n+2*mg}" shape-rendering="crispEdges" role="img" aria-label="QR Code Pix"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
function specHtml(S){return '<div style="font:600 13px Arial,sans-serif;width:72mm;color:#000">'+S.map(x=>{
  if(x.qr){const q=qrMatrix(x.qr);return q?`<div style="width:36mm;margin:6px auto">${qrSvg(q)}</div>`:''}
  if(x.logo)return '';if(x.hr)return '<hr style="border:0;border-top:1.5px dashed #000;margin:6px 0">';if(x.gap)return '<br>'.repeat(x.gap);
  if(x.box)return `<div style="border:1.5px solid #000;text-align:center;font-weight:800;font-size:1.2em;padding:3px;margin:5px 0">${esc(x.box)}</div>`;
  const st=(x.b?'font-weight:800;':'')+(x.s==2?'font-size:1.35em;':'');
  if(x.lr)return `<div style="display:flex;justify-content:space-between;gap:6px;${st}"><span>${esc(x.lr[0])}</span><b>${esc(x.lr[1])}</b></div>`;
  return `<div style="${st}${x.a=='c'?'text-align:center;':''}">${esc(x.t)}</div>`}).join('')+'</div>'}

function fusoLoja(){const h=(typeof EMP=='object'&&EMP&&EMP.hor)||{};if(h.tz)return h.tz;const uf=(String((typeof EMP=='object'&&EMP&&EMP.c)||'').match(/\/\s*([A-Za-z]{2})\s*$/)||[])[1];return (uf&&UFTZ[uf.toUpperCase()])||'America/Sao_Paulo'}
(()=>{for(const k of ['toLocaleString','toLocaleDateString','toLocaleTimeString']){const o=Date.prototype[k];Date.prototype[k]=function(l,op){op=op||{};if(!op.timeZone){try{const tz=fusoLoja();if(tz)op={...op,timeZone:tz}}catch(e){}}return o.call(this,l,op)}}})();
const FUSOS=[['America/Belem','Pará e Amapá (mesma hora de Brasília)'],['America/Sao_Paulo','Brasília (DF, GO, MG, SP, RJ, ES, Sul, Nordeste, TO)'],['America/Manaus','AM, MT, MS, RO, RR (1 hora a menos)'],['America/Rio_Branco','Acre (2 horas a menos)'],['America/Noronha','Fernando de Noronha']];
/* horário em 24 h (o campo "time" do navegador mostrava AM/PM em alguns Windows) */
const HORAS=(()=>{const l=[];for(let h=0;h<24;h++)for(const m of [0,15,30,45])l.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));l.push('23:59');return l})();
function horSel(v,ab,on){const l=v&&!HORAS.includes(v)?[...HORAS,v].sort():HORAS;return `<select class="hsel" ${ab?'':'disabled'} onchange="${on}"><option value="">—</option>${l.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`}
function drawHor(){
  const b=$('#horcorpo');if(!b)return;const d=HOR.d||{},t=(k,j,x)=>((d[k]||[])[j]||[])[x]||'';
  b.innerHTML=`<div class="tw"><table class="horT"><thead><tr><th>Dia</th><th>Aberto</th><th>Das</th><th>Às</th><th>2º turno das</th><th>às</th></tr></thead><tbody>${[1,2,3,4,5,6,0].map(k=>{const ab=(d[k]||[]).length>0;return `<tr><td><b>${DIAS[k]}</b></td><td><input type="checkbox" ${ab?'checked':''} onchange="horDia(${k},this.checked)"></td>
   ${[[0,0],[0,1],[1,0],[1,1]].map(([j,x])=>`<td>${horSel(t(k,j,x),ab,`horSet(${k},${j},${x},this.value)`)}</td>`).join('')}</tr>`}).join('')}</tbody></table></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0"><button type="button" class="b s sm" onclick="horCopia()">Copiar o horário de segunda para terça a sexta</button></div>
  <div class="g3"><div><label>Parar de aceitar pedidos antes de fechar</label><select id="h-antes" onchange="horPrev()">${[0,10,15,20,30,45,60].map(n=>`<option value="${n}" ${(+HOR.antes||0)==n?'selected':''}>${n?n+' minutos antes':'Até a hora de fechar'}</option>`).join('')}</select></div>
   <div style="grid-column:span 2"><label>Fuso horário da loja</label><select id="h-tz" onchange="horPrev()">${FUSOS.map(([v,t])=>`<option value="${v}" ${(HOR.tz||'America/Sao_Paulo')==v?'selected':''}>${t}</option>`).join('')}</select></div></div>
  <label class="ck" style="margin-top:12px"><input type="checkbox" id="h-pausa" ${HOR.pausa?'checked':''} onchange="horPrev()"> ⏸️ <b>Pausar os pedidos agora</b> (muito movimento, falta de entregador…) · também dá para pausar pelo PDV, na tela Pedidos</label>
  <label>Mensagem para o cliente quando pausado</label><input id="h-msg" value="${esc(HOR.msgPausa||'')}" placeholder="Ex.: Muitos pedidos agora, voltamos em 30 minutos" oninput="horPrev()">
  <p id="h-prev" style="margin:10px 0 0;font-weight:700"></p>`;horPrev();
}
window.horDia=(k,on)=>{HOR.d=HOR.d||{};HOR.d[k]=on?[['07:00','19:00']]:[];drawHor()};
window.horSet=(k,j,x,v)=>{HOR.d=HOR.d||{};const l=HOR.d[k]=HOR.d[k]||[];l[j]=l[j]||['',''];l[j][x]=v;HOR.d[k]=l.filter(i=>i&&(i[0]||i[1]));horPrev()};
window.horCopia=()=>{const s=JSON.stringify(HOR.d[1]||[]);[2,3,4,5].forEach(k=>HOR.d[k]=JSON.parse(s));drawHor();toast('Copiado para terça a sexta. Lembre de Salvar.')};
function rdHor(){const v=id=>$('#'+id);return {...HOR,on:v('h-on').checked,antes:+v('h-antes').value||0,tz:v('h-tz').value,pausa:v('h-pausa').checked,msgPausa:v('h-msg').value.trim(),d:Object.fromEntries(Object.entries(HOR.d||{}).map(([k,l])=>[k,(l||[]).filter(i=>i&&i[0]&&i[1])]))}}
window.horPrev=()=>{const p=$('#h-prev');if(!p||!$('#h-on'))return;const h=rdHor(),st=horSt(h);
  p.style.color=st.aberto?'var(--ok)':'var(--rd)';
  p.textContent=!h.on&&!h.pausa?'Sem horário: o app aceita pedidos a qualquer hora.':st.pausa?'Agora: ⏸️ pedidos pausados':st.aberto?'Agora o app está 🟢 ABERTO'+(st.ate?' · pedidos até '+st.ate:''):'Agora o app está 🔴 FECHADO'+(st.abre?' · abre '+st.abre:'')};
/* ===== ENTREGADORES: o celular do entregador entra pelo link/QR com um código (sem senha) ===== */
let ENTS=[];
/* ---------- 💳 Mercado Pago ---------- */
let MPE=null,MPT=null,IPE=null;
async function vMp(){
  $('#v').innerHTML='<div class="card"><p class="mu">Carregando…</p></div>';
  try{[MPE,IPE]=await Promise.all([G.get('/api/mp'),G.get('/api/ip')])}catch(e){MPE=MPE||{ok:false};IPE=IPE||{ok:false}}drawMp();
}
function drawMp(){
  const e=MPE||{},c=e.conta||{};
  const ie=IPE||{};
  $('#v').innerHTML=`<div class="card" style="background:var(--ac2)"><b>💳 Pagamentos online</b><p class="sm" style="margin:4px 0 0">Ligue o Mercado Pago, a InfinitePay ou os dois. <b>Com os dois ligados no app, o cliente escolhe qual usar.</b> No caixa, o Pix integrado e a maquininha integrada são do Mercado Pago. A maquininha InfinitePay continua funcionando normalmente, lançando Débito ou Crédito.</p></div>
  <div class="card"><h3 style="margin-top:0">💳 Mercado Pago</h3>
  ${e.ok?`<p><span class="chip on"><i></i>Conectado</span> <b>${esc(c.nome||'Conta Mercado Pago')}</b>${c.email?' · '+esc(c.email):''} <span class="mu">· token …${esc(e.fim)}</span>${c.teste?' <span class="tag" style="background:var(--wn);color:#fff">CONTA DE TESTE</span>':''}</p>`:'<p class="mu">Ainda não conectado. Cole o Access Token da conta Mercado Pago da loja.</p>'}
  <label>Access Token ${e.ok?'(só preencha para trocar de conta)':''}</label><input id="mp-tk" type="password" autocomplete="off" placeholder="APP_USR-…" style="max-width:560px">
  <details style="margin-top:8px"><summary class="mu" style="cursor:pointer;font-weight:600">Onde pegar o Access Token</summary><ol class="sm" style="margin:8px 0;padding-left:20px">
   <li>Entre em <b>mercadopago.com.br/developers/panel/app</b> com a conta da loja e clique em <b>Criar aplicação</b> (nome: AdaptaSys Mercado; solução: <b>Pagamentos presenciais / online</b>).</li>
   <li>Abra a aplicação › <b>Credenciais de produção</b> e copie o <b>Access Token</b> (começa com <code>APP_USR-</code>).</li>
   <li>O token fica guardado só neste computador. Nunca vai para o app do cliente nem para o Supabase. Não envie para ninguém.</li></ol></details>
  </div>
  <div class="card"><h3 style="margin-top:0">💠 Pix no caixa</h3>
  <label class="ckl"><input type="checkbox" id="mp-pix" ${e.pix||!e.ok?'checked':''}> Gerar o QR Pix do Mercado Pago no pagamento (valor exato, confirma sozinho)</label>
  <p class="sm mu">No PDV, na tela de pagamento, aparece o botão <b>Pix Mercado Pago</b>. O caixa não precisa conferir no celular: quando o cliente paga, a venda libera sozinha.</p></div>
  <div class="card"><h3 style="margin-top:0">🏧 Maquininha Point</h3>
  <label class="ckl"><input type="checkbox" id="mp-pt" ${e.point||e.terminal?'checked':''}> Usar a maquininha Point integrada ao caixa</label>
  <div class="bar" style="flex-wrap:wrap"><select id="mp-term" style="max-width:380px"><option value="">${e.terminal?esc(e.terminal):'— escolha a maquininha —'}</option>${(MPT||[]).map(t=>`<option value="${esc(t.id)}" ${t.id==e.terminal?'selected':''}>${esc(t.id)} · ${t.modo=='PDV'?'modo PDV ✅':'modo '+esc(t.modo||'?')}</option>`).join('')}</select><button class="b s" onclick="mpTerms()">🔎 Buscar maquininhas</button><button class="b s" onclick="mpModo()">Colocar no modo PDV</button></div>
  <div class="g3"><div><label>Parcelado no crédito</label><select id="mp-jr"><option value="loja" ${e.juros!='cliente'?'selected':''}>Juros por conta da loja</option><option value="cliente" ${e.juros=='cliente'?'selected':''}>Juros por conta do cliente</option></select></div><div style="display:flex;align-items:flex-end"><label class="ckl"><input type="checkbox" id="mp-via" ${e.via?'checked':''}> Imprimir a via na maquininha</label></div></div>
  <p class="sm mu">Modelos aceitos: Point Smart (Newland N950, Ingenico Move2500, Gertec MP35P, PAX A910, PAX Q92). A maquininha precisa estar ligada, com internet e no <b>modo PDV</b> (botão acima). No modo PDV ela só recebe cobranças vindas do caixa.</p></div>
  <div class="card"><h3 style="margin-top:0">📱 Pagamento pelo app do cliente</h3>
  <label class="ckl"><input type="checkbox" id="mp-app" ${e.app?'checked':''}> Cliente pode pagar pelo app (Pix com QR e copia e cola, ou cartão)</label>
  <div class="g3"><div><label>Prazo para o cliente pagar</label><select id="mp-pz">${[10,15,20,30,45,60].map(m=>`<option value="${m}" ${(e.prazo||20)==m?'selected':''}>${m} minutos</option>`).join('')}</select></div></div>
  <p class="sm mu">É opcional para o cliente: ele também pode pagar na entrega. O pedido só toca no caixa <b>depois de pago</b>. Se não pagar no prazo, o pedido é cancelado sozinho e o estoque volta. Se a loja cancelar um pedido já pago, o dinheiro é devolvido ao cliente pelo Mercado Pago. <b>Este computador precisa estar ligado e com internet</b> para gerar e conferir os pagamentos.</p></div>
  <div class="card"><div class="bar"><button class="b" onclick="mpSalvar()">💾 Salvar Mercado Pago</button>${e.ok?'<div class="sp"></div><button class="b gh" style="color:var(--rd)" onclick="mpRemover()">Desconectar a conta</button>':''}</div></div>
  <div class="card"><h3 style="margin-top:0">🟢 InfinitePay</h3>
  ${ie.ok?`<p><span class="chip"><i></i>Conectada</span> <b>$${esc(ie.tag)}</b>${ie.chave?' <span class="mu">· com API Key</span>':''}</p>`:'<p class="mu">Ainda não conectada.</p>'}
  <div class="g2"><div><label>InfiniteTag da loja</label><input id="ip-tag" placeholder="$mercadodojoao" value="${esc(ie.tag?'$'+ie.tag:'')}"></div><div><label>API Key (opcional, recomendada) ${ie.chave?'· já cadastrada':''}</label><input id="ip-key" type="password" autocomplete="off" placeholder="inchk_…"></div></div>
  <label class="ckl"><input type="checkbox" id="ip-app" ${ie.app?'checked':''}> Cliente pode pagar pelo app com a InfinitePay (Pix ou cartão em até 12x)</label>
  <details style="margin-top:4px"><summary class="mu" style="cursor:pointer;font-weight:600">Como funciona e onde pegar</summary><ul class="sm" style="margin:8px 0;padding-left:20px">
   <li><b>InfiniteTag</b>: é o seu nome de usuário no app da InfinitePay (aparece com $ no perfil).</li>
   <li><b>API Key</b>: gere no app ou na Conta Web da InfinitePay, na área de integrações do Checkout (começa com <code>inchk_</code> e aparece uma vez só). Com ela, o link de pagamento <b>vence junto com o prazo</b> do pedido e só pode ser pago uma vez. Fica guardada só neste computador.</li>
   <li>O cliente paga numa página da InfinitePay e volta para o app. O sistema confere o pagamento direto com a InfinitePay antes de mandar o pedido para o caixa.</li>
   <li>${ie.site?'Endereço do app para a volta do cliente: <b>'+esc(ie.site)+'</b>':'<b class="neg">Preencha o endereço do site do app em Ajustes da loja</b> para o cliente voltar para o app depois de pagar.'}</li>
   <li>A InfinitePay não permite devolver pagamento pelo sistema: se cancelar um pedido já pago, devolva pelo app da InfinitePay (o sistema avisa).</li></ul></details>
  <div class="bar" style="margin-top:8px"><button class="b" onclick="ipSalvar()">💾 Salvar InfinitePay</button>${ie.chave?'<button class="b s" onclick="ipSalvar(true)">Remover a API Key</button>':''}${ie.ok?'<div class="sp"></div><button class="b gh" style="color:var(--rd)" onclick="ipRemover()">Desconectar</button>':''}</div></div>`;
}
async function mpSalvar(){
  const b={tokenMp:$('#mp-tk').value.trim(),pix:$('#mp-pix').checked,point:$('#mp-pt').checked,terminal:$('#mp-term').value||(MPE&&MPE.terminal)||'',juros:$('#mp-jr').value,via:$('#mp-via').checked,app:$('#mp-app').checked,prazo:+$('#mp-pz').value};
  if(b.point&&!b.terminal)return toast('Escolha a maquininha (Buscar maquininhas).','er');
  try{MPE=await G.post('/api/mp/config',b);toast('Mercado Pago salvo.');drawMp()}catch(e){toast(e.message,'er')}
}
async function mpTerms(){try{MPT=await G.post('/api/mp/terminais',{});if(!MPT.length)toast('Nenhuma maquininha Point ligada a esta conta.','er');else toast(MPT.length+' maquininha(s) encontrada(s).');const k=$('#mp-term').value;drawMp();if(k)$('#mp-term').value=k}catch(e){toast(e.message,'er')}}
async function mpModo(){const id=$('#mp-term').value;if(!id)return toast('Busque e escolha a maquininha.','er');try{MPT=await G.post('/api/mp/modo-pdv',{id});toast('Maquininha no modo PDV. Reinicie a maquininha se ela pedir.');drawMp();$('#mp-term').value=id}catch(e){toast(e.message,'er')}}
async function ipSalvar(tirar){try{IPE=await G.post('/api/ip/config',{tag:$('#ip-tag').value,chaveIp:tirar?'':$('#ip-key').value.trim(),tirarChave:!!tirar,app:$('#ip-app').checked});toast('InfinitePay salva.');drawMp()}catch(e){toast(e.message,'er')}}
async function ipRemover(){if(!confirm('Desconectar a InfinitePay? O pagamento pelo app com InfinitePay para.'))return;try{IPE=await G.post('/api/ip/config',{remover:true});toast('InfinitePay desconectada.');drawMp()}catch(e){toast(e.message,'er')}}
async function mpRemover(){if(!confirm('Desconectar a conta Mercado Pago deste sistema? O Pix do caixa, a maquininha e o pagamento pelo app param.'))return;try{MPE=await G.post('/api/mp/config',{remover:true});toast('Conta desconectada.');drawMp()}catch(e){toast(e.message,'er')}}
async function vEnt(){
  $('#v').innerHTML=`<div class="card"><h2>🏍️ Entregadores</h2><p class="mu">O entregador abre a tela dele no celular, vê os pedidos aceitos para entrega com a rota no mapa, a referência, o valor e o troco, e marca <b>Entregue</b> ao deixar o pedido. O PDV e o cliente ficam sabendo na hora. Precisa de internet.</p>
  <div class="bar" style="flex-wrap:wrap;align-items:end"><div><label>Nome</label><input id="en-n" placeholder="Nome do entregador" style="max-width:260px"></div>
   <div><label>Valor de cada entrega</label><select id="en-m" onchange="$('#en-v').hidden=this.value=='taxa'"><option value="fixo">Valor fixo</option><option value="taxa">A taxa de entrega do pedido</option></select></div>
   <div><label>R$ por entrega</label><input id="en-v" inputmode="decimal" placeholder="5,00" style="max-width:110px"></div><button class="b" onclick="entNovo()">➕ Cadastrar entregador</button></div>
  ${EMP.site?'':'<p style="color:var(--wn);font-weight:600">Preencha o endereço do site em Ajustes da loja para gerar o link e o QR Code.</p>'}
  <div id="enl"><p class="mu">Carregando…</p></div></div>`;
  try{if(!EMP.site){const c=await G.get('/api/config');if(c)EMP={...EMP,...c}}}catch(e){}
  entLista();
}
const entLink=c=>(EMP.site||'').replace(/\/?$/,'/')+'entregador/#c='+encodeURIComponent(c);
async function entLista(){
  const b=$('#enl');if(!b)return;
  try{ENTS=await G.get('/api/entregadores')||[]}catch(e){b.innerHTML='<p style="color:var(--rd)">'+esc(e.message)+'</p>';return}
  b.innerHTML=ENTS.length?ENTS.map(e=>`<div class="card" style="box-shadow:none;border:1px solid var(--bd);margin:10px 0"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
    <div><b style="font-size:17px">${esc(e.nome)}</b><br><span style="font-weight:600;color:var(--${e.pareado?'ok':'mu'})">${e.pareado?'✅ Celular conectado'+(e.ultimo?' · visto '+new Date(e.ultimo).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):''):'⏳ Esperando o entregador entrar com o código'}</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b s sm" onclick="entCod('${e.id}')">🔑 Novo código</button><button class="b gh sm" style="color:var(--rd)" onclick="entRem('${e.id}','${esc(e.nome)}')">Remover</button></div></div>
    <div class="g4" style="margin-top:10px">
     <div class="card" style="box-shadow:none;margin:0;padding:10px"><small class="mu">Hoje</small><br><b style="font-size:20px">${+e.hoje_n||0}</b> entrega${+e.hoje_n==1?'':'s'}<br><span class="mu">${R(e.hoje_v)}${+e.hoje_din?' · recebeu '+R(e.hoje_din)+' em dinheiro':''}</span></div>
     <div class="card" style="box-shadow:none;margin:0;padding:10px"><small class="mu">Este mês</small><br><b style="font-size:20px">${+e.mes_n||0}</b> entrega${+e.mes_n==1?'':'s'}<br><span class="mu">${R(e.mes_v)} · pago ${R(e.pago_mes)}</span></div>
     <div class="card" style="box-shadow:none;margin:0;padding:10px;background:${+e.saldo>0?'var(--wn2)':'var(--ok2)'}"><small class="mu">${+e.saldo>=0?'Saldo a pagar':'Adiantado (pago a mais)'}</small><br><b style="font-size:22px">${R(Math.abs(+e.saldo||0))}</b><br><button class="b sm" style="margin-top:4px" onclick="entPagar('${e.id}','${esc(e.nome)}',${+e.saldo||0})">💸 Registrar pagamento</button></div>
     <div class="card" style="box-shadow:none;margin:0;padding:10px"><small class="mu">Valor de cada entrega</small><select id="em-${e.id}" style="margin:4px 0" onchange="$('#ev-${e.id}').hidden=this.value=='taxa'"><option value="fixo" ${e.modo!='taxa'?'selected':''}>Valor fixo</option><option value="taxa" ${e.modo=='taxa'?'selected':''}>A taxa de entrega do pedido</option></select>
      <div style="display:flex;gap:6px"><input id="ev-${e.id}" inputmode="decimal" value="${f2(e.valor||0)}" ${e.modo=='taxa'?'hidden':''} style="max-width:100px"><button class="b s sm" onclick="entCfg('${e.id}')">Salvar</button></div></div></div>
    ${e.codigo?entCodHtml(e):''}</div>`).join(''):'<p class="mu">Nenhum entregador cadastrado ainda.</p>';
}
function entCodHtml(e){
  const l=EMP.site?entLink(e.codigo):'',q=l?qrSvg(qrMatrix(l)):'';
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:10px;background:var(--ac2);border-radius:12px;padding:12px">
   ${q?`<div style="width:150px;background:#fff;padding:6px;border-radius:8px">${q}</div>`:''}
   <div><div class="mu">Código (vale 24 horas, uma vez só)</div><div style="font:800 28px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.12em">${esc(e.codigo.replace(/(.{4})/,'$1-'))}</div>
   <p class="mu" style="margin:6px 0">${l?'No celular do entregador: <b>aponte a câmera para o QR Code</b> ou abra o link abaixo.':'Abra no celular do entregador: SEU-SITE/entregador/ e digite o código.'} O app de Entregas é separado do app de compras: tem ícone próprio (moto vermelha) e o entregador instala à parte.</p>
   ${l?`<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="b s sm" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Olá '+e.nome+'! Abra este link no seu celular para receber as entregas da '+(EMP.n||'loja')+': '+l)}">💬 Enviar pelo WhatsApp</a><button class="b gh sm" onclick="navigator.clipboard.writeText('${l}').then(()=>toast('Link copiado.'))">📋 Copiar link</button></div>`:''}</div></div>`;
}
async function entCfg(id){try{await G.post('/api/entregadores/config',{id,modo:$('#em-'+id).value,valor:num($('#ev-'+id).value)||0});toast('Valor da entrega salvo. Vale para as próximas entregas.');entLista()}catch(e){toast(e.message,'er')}}
function entPagar(id,nome,saldo){
  openM(`<h3>💸 Pagar ${esc(nome)}</h3><p class="mu">Registra o que a loja pagou ao entregador. O saldo dele diminui e ele vê o pagamento no celular.</p>
  <label>Valor pago</label><input id="pg-v" inputmode="decimal" value="${saldo>0?f2(saldo):''}"><label>Observação</label><input id="pg-o" placeholder="Ex.: acerto da semana, Pix, dinheiro">
  <div class="mb"><button class="b s" onclick="closeM()">Voltar</button><button class="b" onclick="entPagarOk('${id}')">Registrar pagamento</button></div>`);

  $('#cpch').innerHTML=F.map(([k,t,f])=>`<button class="${CPF==k?'on':''}" onclick="CPF='${k}';drawCp()">${t} (${d.contas.filter(f).length})</button>`).join('');
  const f=(F.find(x=>x[0]==CPF)||F[0])[2],l=d.contas.filter(f);if(CPF=='pagas')l.reverse();

    const sit=c.pago?`<span class="tag ok">Paga ${dBr(c.pago.data)}</span><small>${esc(c.pago.forma)}${c.pago.valor!=c.valor?' · '+R(c.pago.valor):''}</small>`:n<0?`<span class="tag rd">Vencida há ${-n} dia(s)</span>`:n==0?`<span class="tag wn">Vence hoje</span>`:`<span class="tag">Em ${n} dia(s)</span>`;

     <td class="r" style="white-space:nowrap">${c.pago?`<button class="b gh sm" onclick="pagoDesf('${c.id}')">Desfazer</button>`:`<button class="b ok sm" onclick="pagarM('${c.id}')">✔ Pagar</button>`}<button class="b gh sm" onclick="contaM('${c.id}')">Editar</button><button class="b gh sm" onclick="contaDel('${c.id}')">✕</button></td></tr>`}).join('')||'<tr><td colspan="6" class="mu" style="text-align:center;padding:24px">Nenhuma conta nesta lista.</td></tr>';

function code128c(dig){
  const v=[105];for(let i=0;i<dig.length;i+=2)v.push(+dig.substr(i,2));
  let ck=105;for(let i=1;i<v.length;i++)ck+=v[i]*i;v.push(ck%103,106);
  let x=10,r='';for(const k of v){const p=C128[k];for(let j=0;j<p.length;j++){const w=+p[j];if(j%2==0)r+=`<rect x="${x}" y="0" width="${w}" height="50"/>`;x+=w}}

}

/* ===== REDE E SEGURANÇA ===== */
let PRT=null;
async function vRede(){
  const r=await G.get('/api/rede');const ok=(b,t,f)=>`<div class="ln" style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--ln)"><span style="font-size:20px">${b?'✅':'⚠️'}</span><div><b>${t}</b><div class="mu sm">${f}</div></div></div>`;
  const i=r.integridade||{};
  $('#v').innerHTML=`<div class="card"><h2>Segurança do sistema</h2>
  ${ok(r.servico,'Servidor protegido do Windows',r.servico?'Roda como serviço do sistema: liga junto com o computador, sem janela, e quem usa o computador não consegue fechar.':'Está rodando na conta de quem usa o computador. Rode o <b>instalar.bat</b> novo (como administrador) para proteger.')}
  ${ok(r.servico,'Pasta de dados trancada',`Banco, certificado e XMLs em <code>${esc(r.dados)}</code>. ${r.servico?'Só o sistema e o administrador do Windows abrem.':'Fica trancada depois do instalador novo.'}`)}
  ${ok(i.ok!==false,'Arquivos do sistema conferidos',i.ok===false?`<b style="color:var(--rd)">Alguém alterou: ${esc((i.alterados||[]).join(', '))}</b>. Reinstale pelo pacote original.`:i.semLista?'Sem a lista de conferência (versão de desenvolvimento).':'Iguais ao original'+(i.versao?' (versão '+esc(i.versao)+')':'')+'.')}
  ${ok(r.certProtegido,'Senha do certificado criptografada',r.certProtegido?'Guardada criptografada pelo Windows: só este computador abre.':'Fica criptografada no Windows quando o certificado for instalado (ou na próxima vez que o servidor ligar).')}
  <p class="mu sm" style="margin:10px 0 0">Importante: quem tem a <b>senha de administrador do Windows</b> passa por cima de qualquer trava. Deixe a conta do caixa (e a usada por técnicos de outros sistemas) <b>sem administrador</b>.</p></div>
  <div class="card"><h2>Caixas da rede</h2>
  ${r.rede?`<p class="mu" style="margin-top:0">Este computador é o <b>servidor</b> da loja (${esc(r.maquina)} · ${esc((r.ips||[]).join(', '))} · porta ${r.porta}). Os outros caixas se conectam a ele pela rede da loja. Ele precisa ficar ligado.</p>
   <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="b" onclick="parearM()">➕ Parear novo caixa</button><span class="mu sm">No outro computador: instale como "Caixa" e digite o código que aparecer aqui.</span></div>
   <div class="tw" style="margin-top:12px"><table><thead><tr><th>Caixa</th><th>Último contato</th><th>Endereço</th><th></th></tr></thead><tbody>${(r.terminais||[]).map(t=>`<tr><td><b>${esc(t.nome)}</b><small>pareado em ${new Date(t.criado).toLocaleDateString('pt-BR')}</small></td><td>${t.ultimo?new Date(t.ultimo).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—'}</td><td>${esc(t.ip||'')}</td><td class="r"><button class="b gh sm" onclick="remCx('${t.id}','${esc(t.nome)}')">Remover</button></td></tr>`).join('')||'<tr><td colspan="4" class="mu" style="text-align:center;padding:14px">Nenhum outro caixa conectado.</td></tr>'}</tbody></table></div>`
  :'<p class="mu" style="margin-top:0">A rede está <b>desligada</b>: só este computador usa o sistema. Para ter mais caixas, rode o <b>instalar.bat</b> e escolha <b>"Servidor (com outros caixas na rede)"</b>. O instalador libera a rede da loja sozinho; não precisa mexer no firewall.</p>'}</div>`;
}
async function parearM(){
  try{PRT=await G.post('/api/rede/codigo')}catch(e){return toast(e.message,'er')}
  openM(`<h3>Parear novo caixa</h3><p class="mu">No outro computador, abra o PDV (instalado como "Caixa"), toque em <b>Procurar o servidor</b> e digite este código:</p>
  <div style="font:800 54px/1.1 var(--fh,system-ui);letter-spacing:.25em;text-align:center;margin:14px 0">${PRT.codigo}</div><p class="mu" style="text-align:center">Vale por <b id="pcd">10:00</b> minutos · servidor ${esc((PRT.ips||[])[0]||'')}:${PRT.porta}</p>
  <div class="mb"><button class="b" onclick="closeM();vRede()">Pronto</button></div>`);
  const t=setInterval(()=>{const e=$('#pcd');if(!e){clearInterval(t);return}const ms=Math.max(0,PRT.expira-Date.now());e.textContent=Math.floor(ms/60000)+':'+String(Math.floor(ms/1000)%60).padStart(2,'0');if(!ms){clearInterval(t);e.textContent='vencido'}},1000);
}
function remCx(id,n){openM(`<h3>Remover ${esc(n)}?</h3><p class="mu">Esse computador deixa de acessar o sistema. Para voltar, é só parear de novo.</p><div class="mb"><button class="b s" onclick="closeM()">Voltar</button><button class="b rd" onclick="remCxOk('${id}')">Remover</button></div>`)}
async function remCxOk(id){try{await G.post('/api/rede/remover',{id});closeM();toast('Caixa removido.');vRede()}catch(e){toast(e.message,'er')}}

init();
</script></body></html>
