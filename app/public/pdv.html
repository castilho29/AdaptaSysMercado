<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDV · AdaptaSys Mercado</title>
<link rel="icon" href="adaptasys-64.png"><meta name="theme-color" content="#FFFFFF">
<style>
:root{--bg:#eef2f8;--card:#fff;--tx:#14213d;--mu:#5b6b84;--bd:#d8e0ec;--ac:#0b4aa8;--ac2:#e3edfb;--b1:#1a6ae0;--b2:#0b4aa8;--ok:#1a9a5a;--ok2:#e2f5ea;--rd:#c0392b;--rd2:#fbe7e4;--wn:#b45309;--wn2:#fdf0dc;--sel:#fff3c4}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px #1a6ae033}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
kbd{display:inline-block;min-width:26px;padding:1px 5px;border-radius:6px;background:var(--bg);border:1px solid var(--bd);border-bottom-width:2px;font:700 11px ui-monospace,Consolas,monospace;color:var(--mu);text-align:center}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
/* botões */
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:0;border-radius:12px;background:linear-gradient(180deg,var(--b1),var(--b2));color:#fff;font-weight:700;box-shadow:0 2px 6px #0002;transition:filter .12s,transform .1s}
.b:hover{filter:brightness(1.07)}.b:active{transform:scale(.98)}
.b:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.b.s{background:var(--ac2);color:var(--ac);box-shadow:inset 0 0 0 1.5px var(--ac)}
.b.ok{background:linear-gradient(180deg,#2bb673,#1a9a5a)}
.b.rd{background:linear-gradient(180deg,#e85a46,#c0392b)}
.b.gh{background:transparent;color:var(--mu);box-shadow:none}
.b kbd{background:#ffffff26;color:inherit;border-color:#ffffff40}
.b.s kbd{background:var(--card);border-color:var(--bd)}
/* topo */
.hd{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--bd);height:60px}
.hd img{width:42px;height:42px;object-fit:contain;border-radius:10px}
.hd .nm{font-weight:800;font-size:17px;line-height:1.1}.hd .nm small{display:block;font-weight:600;font-size:12px;color:var(--mu)}
.hd .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;font-size:12.5px;font-weight:700;background:var(--bg);color:var(--mu);border:1px solid var(--bd);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.chip.off{background:var(--rd2);color:var(--rd);border-color:transparent}.chip.off i{background:var(--rd)}
.chip.wn{background:var(--wn2);color:var(--wn);border-color:transparent}
.clock{font:800 18px ui-monospace,Consolas,monospace;color:var(--tx)}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--mu);display:inline-flex;align-items:center;justify-content:center;font-size:18px}
/* layout */
.pdv{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px;padding:14px;height:calc(100vh - 60px)}
.lf,.rt{display:flex;flex-direction:column;gap:12px;min-height:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 1px 3px #0000000d}
.scan{position:relative}
.scan input{font-size:22px;padding:14px 16px 14px 52px;border-radius:14px;background:var(--card);border-width:2px;height:60px}
.scan .ico{position:absolute;left:16px;top:17px;font-size:22px;opacity:.6;pointer-events:none}
.scan .mt{position:absolute;right:12px;top:14px;background:var(--wn2);color:var(--wn);font-weight:800;padding:6px 10px;border-radius:10px}
.sg{position:absolute;left:0;right:0;top:64px;z-index:20;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 12px 30px #0003;overflow:hidden;max-height:60vh;overflow-y:auto}
.sg div{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd);cursor:pointer}
.sg div.on,.sg div:hover{background:var(--ac2)}
.sg small{color:var(--mu)}.sg .z{color:var(--rd);font-weight:700;font-size:12px}
.last{display:flex;align-items:center;gap:14px;padding:12px 16px}
.last .ln{flex:1;min-width:0}.last .ln b{display:block;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.last .ln span{color:var(--mu)}
.last .lt{font:800 26px system-ui;font-variant-numeric:tabular-nums}
.ordbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--ac2);border:1.5px solid var(--ac);color:var(--tx)}
.ordbar b{color:var(--ac)}.ordbar .sp{flex:1}
.lines{flex:1;min-height:0;overflow:auto}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--card);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mu);padding:10px 12px;border-bottom:1.5px solid var(--bd);z-index:1}
td{padding:9px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}
td small{display:block;color:var(--mu);font-size:12px}
.r{text-align:right;white-space:nowrap}.n{color:var(--mu);width:36px}
tr.sel td{background:var(--sel)}
tbody tr{cursor:pointer}
.x{border:0;background:none;color:var(--rd);font-size:16px;padding:4px 8px;border-radius:8px;opacity:.6}.x:hover{opacity:1;background:var(--rd2)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--mu);text-align:center;padding:30px;gap:6px}
.empty b{font-size:20px;color:var(--tx)}
.tot{padding:16px}
.tot .big{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px}
.tot .big span{font-weight:700;color:var(--mu)}
.tot .big b{font:800 46px/1 system-ui;font-variant-numeric:tabular-nums;color:var(--ac)}
.kv{display:flex;justify-content:space-between;padding:3px 0;color:var(--mu)}.kv b{color:var(--tx)}
.kv.dc b{color:var(--rd)}
.cli{padding:12px 14px;display:flex;align-items:center;gap:10px}
.cli .sp{flex:1;min-width:0}.cli b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cli small{color:var(--mu)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.keys .b{font-size:13px!important;padding:0 8px!important;gap:6px!important}
.keys .b{justify-content:flex-start;min-height:46px;padding:0 12px;font-size:14px;position:relative}
.keys .b .bd{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--rd);color:#fff;border-radius:10px;padding:1px 7px;font-size:12px}
.pay{min-height:64px;font-size:20px;width:100%}
.foot{display:flex;justify-content:space-between;gap:4px}.foot .b{white-space:nowrap;padding:0 10px;font-size:14px}
/* modais */
.ov{position:fixed;inset:0;background:#0009;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:3vh 16px 16px;overflow:auto}
.md{background:var(--card);color:var(--tx);border-radius:18px;padding:20px;width:100%;max-width:520px;box-shadow:0 20px 60px #0006}
.md.wide{max-width:760px}
.md h3{margin:0 0 6px;font-size:20px}
.md .mu{color:var(--mu);font-size:13.5px}
.mb{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pgt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.pgt div{background:var(--bg);border-radius:12px;padding:10px 12px}.pgt small{display:block;color:var(--mu);font-weight:700;font-size:12px}
.pgt b{font:800 26px system-ui;font-variant-numeric:tabular-nums}
.pgt .ok{background:var(--ok2)}.pgt .ok b{color:var(--ok)}.pgt .rd{background:var(--rd2)}.pgt .rd b{color:var(--rd)}
.fp{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}
.opg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}.opg .b{min-height:64px;flex-direction:column;gap:2px}.opg small{font-weight:600;opacity:.8}
.sold2{color:var(--rd);font-weight:800}.vl{max-height:38vh;overflow:auto;margin-top:6px}
.lnk{border:0;background:none;color:var(--ac);font-weight:700;cursor:pointer;padding:4px 6px;border-radius:8px}.lnk:hover{background:var(--ac2)}
.fp .b{min-height:56px;flex-direction:column;gap:2px;font-size:15px}
.pgv{font-size:28px!important;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.ck{display:flex;align-items:center;gap:10px;margin:10px 0 0;color:var(--tx);font-size:14.5px;cursor:pointer}.ck input{width:20px;height:20px;margin:0}
.olist{max-height:55vh;overflow:auto;margin-top:8px}
.oi{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border:1.5px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer}
.oi.on,.oi:hover{border-color:var(--ac);background:var(--ac2)}
.oi small{color:var(--mu)}.oi .v{font-weight:800;font-size:18px;text-align:right}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11.5px;font-weight:800;background:var(--wn2);color:var(--wn)}.tag.ok{background:var(--ok2);color:var(--ok)}
.mpfp .mpb{border-color:#00A0E3;color:#0077B5}.mpesp{font-weight:700;font-size:16px;color:var(--ac);margin:10px 0}.mpesp small{display:block;color:var(--mu);font-weight:600}.mpmaq{display:flex;gap:18px;align-items:center;font-size:17px;padding:14px;border-radius:14px;background:var(--ac2)}.mpmaq>:first-child{font-size:64px}.mpok{background:#E6F6EE;color:#178A4E;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:800;margin-left:6px}
.qr{display:flex;align-items:center;gap:14px;margin:10px 0;padding:10px;background:#fff;border-radius:12px;color:#000}
.qr svg{width:150px;height:150px;flex:none}.qr div{display:flex;flex-direction:column;gap:4px}
.done{text-align:center}.done .tr{font:800 54px system-ui;color:var(--ok);font-variant-numeric:tabular-nums;margin:6px 0}
.hk{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300;background:var(--tx);color:var(--card);padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px #0005;max-width:90vw}
.toast.wn{background:var(--wn);color:#fff}.toast.er{background:var(--rd);color:#fff}
.login{max-width:400px;margin:10vh auto;padding:24px;text-align:center}
.login img{width:84px;height:84px;object-fit:contain}
.login label{text-align:left}
@media(max-width:960px){.pdv{grid-template-columns:1fr;height:auto}.lines{min-height:300px;max-height:50vh}.hd .hide-s{display:none}}
/* cupom */
#pcup{display:none}
.cpw .cp{font-family:Arial,Helvetica,sans-serif;font-weight:600;line-height:1.3;color:#000;background:#fff;font-size:calc(12px*var(--ps,1))}
.cpw .cp hr{border:0;border-top:1.5px dashed #000;margin:.55em 0}
.cpw .cl{display:block;margin:0 auto .3em;width:var(--lw,40mm);max-width:100%;height:auto}
.cpw .cn{text-align:center;font-size:1.4em;font-weight:800;line-height:1.15}
.cpw .cs{text-align:center;font-size:.95em}
.cpw .cb2{text-align:center;font-size:1.4em;font-weight:800}
.cpw .ci{font-weight:700;margin-top:.3em}
.cpw .cr{display:flex;justify-content:space-between;gap:6px}
.cpw .ct{font-size:1.4em;font-weight:800;margin:.2em 0}
.cpw .cbig{font-size:1.25em;font-weight:800;border:1.5px solid #000;padding:.25em;text-align:center;margin:.4em 0}
@media print{
  body.pr>*:not(#pcup){display:none!important}
  body.pr{background:#fff}
  body.pr #pcup{display:block}
  #pcup .cp{width:72mm;padding-bottom:6mm;break-after:page}
}

/* ===== tema claro (padrão) ===== */
:root{color-scheme:light;--bg:#F6F8FB;--card:#FFFFFF;--tx:#1B2433;--mu:#6B778A;--bd:#E3E8EF;--ln:#EEF1F5;--ac:#1E4FD8;--ac-h:#1843BC;--ac2:#EEF3FF;--b1:#1E4FD8;--b2:#1E4FD8;--ok:#18A058;--ok2:#E8F6EE;--rd:#D9363E;--rd2:#FDECEC;--wn:#9A5B00;--wn2:#FFF4DC;--sel:#FFF8E1;--yl:#FFC629;--yl-d:#F2A900}
body{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:15px}
.b{background:var(--ac);box-shadow:none;border-radius:10px;font-weight:650;transition:background .12s}
.b:hover{filter:none;background:var(--ac-h)}.b:active{transform:none;background:#153A9E}
.b.s{background:#fff;color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd)}.b.s:hover{background:var(--ac2);box-shadow:inset 0 0 0 1px #C8D5F6}
.b.ok{background:var(--ok)}.b.ok:hover{background:#148A4B}
.b.rd{background:var(--rd)}.b.rd:hover{background:#BE2B33}
.b.gh{background:transparent;color:var(--mu)}.b.gh:hover{background:var(--ln);color:var(--tx)}
.b:disabled{background:#C9D3E3;color:#fff;opacity:1;filter:none}
.b:focus-visible,.ib:focus-visible,input:focus-visible{outline:3px solid rgba(30,79,216,.35);outline-offset:2px}
kbd{background:#F1F4F8;border:1px solid var(--bd);color:var(--mu);font-family:inherit;font-weight:700;border-radius:5px}
.b kbd{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);color:#fff}
.b.s kbd,.b.gh kbd{background:#F1F4F8;border-color:var(--bd);color:var(--mu)}
.hd{height:64px;padding:8px 20px}.hd .nm{font-weight:750;letter-spacing:-.01em}.hd img{width:44px;height:44px}
.chip{background:#fff;font-weight:650}.chip i{background:var(--ok)}
.ib{background:#fff;border-color:var(--bd);color:var(--tx)}.ib:hover{background:var(--ac2)}
.clock{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;font-weight:700;color:var(--mu)}
.pdv{padding:16px 20px;gap:16px;height:calc(100vh - 64px)}
.card{box-shadow:none;border-radius:14px}
.scan input{border:1.5px solid var(--bd);background:#fff;font-size:21px}
.scan input:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(30,79,216,.12)}
.last{border-left:4px solid var(--ac)}.last .ln b{font-weight:700}.last .lt{font-weight:750;letter-spacing:-.01em}
th{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:650;color:var(--mu)}
td{border-bottom-color:var(--ln)}
tbody tr:hover td{background:#FAFBFD}
tr.sel td{background:var(--sel)}tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--yl-d)}
.empty{color:var(--mu)}.empty b{font-weight:700}
.tot{padding:14px 16px}.kv{padding:4px 0}
/* a etiqueta de preço: o destaque da tela */
.etq{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--yl);color:#1B2433;padding:16px 22px 16px 54px;min-height:92px;clip-path:polygon(26px 0,100% 0,100% 100%,26px 100%,0 50%);border-radius:0 14px 14px 0}
.etq i{position:absolute;left:24px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(27,36,51,.35)}
.etq span{font-weight:700;font-size:16px}
.etq b{font:800 48px/1 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:#1B2433}
.keys .b{min-height:46px;font-weight:650}
.pay{min-height:62px;font-size:19px;border-radius:12px}
.cli{padding:10px 14px}
/* janelas */
.ov{background:rgba(27,36,51,.32)}
.md{border-radius:18px;box-shadow:0 24px 64px rgba(27,36,51,.18);padding:22px}
.md h3{font-weight:750;letter-spacing:-.01em}
.pgt div{background:#F4F6FA}.pgt small{font-weight:650}.pgt b{letter-spacing:-.01em}
.oi{border:1px solid var(--bd)}.oi.on,.oi:hover{border-color:var(--ac);background:var(--ac2)}
.sg{border-color:var(--bd);box-shadow:0 12px 32px rgba(27,36,51,.12)}
.toast{background:#1B2433;color:#fff}
.login{border-radius:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* menu rápido e compras guardadas */
.rap{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:8px;max-height:148px;overflow:auto}
.rap button{min-height:68px;border:1px solid var(--bd);background:#fff;border-radius:12px;padding:6px 10px 6px 6px;text-align:left;display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--tx)}
.rap .ft{flex:none;width:54px;height:54px;border-radius:9px;background:#F1F4F9;display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:700;font-size:20px;color:#8A97AB}
.rap .ft img{width:100%;height:100%;object-fit:contain}
.rap .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.rap button:hover{background:var(--ac2);border-color:#C8D5F6}.rap button:active{transform:scale(.98)}
.rap button b{font-size:14px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rap button span{font-size:13px;color:var(--mu)}.rap button.cfg{align-items:center;text-align:center;color:var(--ac);font-weight:650;border-style:dashed}
.rap button.z{opacity:.55}
.park{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.park .b{min-height:44px;font-size:14px;white-space:nowrap}
.park .b .bd{background:var(--wn);color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
.pk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer}
.pk:hover{border-color:var(--ac);background:var(--ac2)}

/* cores escolhidas nos ajustes (seguem a cor principal) */
.b:active{background:var(--ac-h)}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--ac)}
.b.s:hover,.rap button:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 30%,#fff);border-color:color-mix(in srgb,var(--ac) 30%,#fff)}
.b:focus-visible,.ib:focus-visible,input:focus-visible{outline-color:color-mix(in srgb,var(--ac) 35%,transparent)}
.scan input:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 12%,transparent)}
/* relógio do topo: hora, cidade, data e sincronização juntos */
.rel{display:flex;align-items:center;gap:12px;padding:5px 14px 5px 12px;border:1px solid var(--bd);border-radius:12px;background:#fff}
.rel>b{font:700 26px/1 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--tx)}
.rel>div{display:flex;flex-direction:column;gap:2px;font-size:12.5px;line-height:1.25;color:var(--mu);white-space:nowrap}
.rel #dt{font-weight:650;color:var(--tx)}
.rel .st{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.rel .st i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.rel .st.off{color:var(--rd)}.rel .st.off i{background:var(--rd)}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 4px}
.sw button{border:2px solid var(--bd);background:#fff;border-radius:12px;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;font-size:12.5px;color:var(--tx)}
.sw button.on{border-color:var(--tx)}
.sw .cx{display:flex;width:100%;height:30px;border-radius:7px;overflow:hidden}.sw .cx i{flex:1}
.opc{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.cqr svg{width:36mm;height:36mm;display:block;margin:6px auto}

/* ===== temas: cartões, letras e cantos seguem o tema escolhido ===== */
.hd,.card,.md,.chip,.ib,.rel,.rap button,.sw button,.scan input,.b.s,.pk,.tw{background:var(--card)}
.tabs button:hover{background:var(--ac2)}
.b.s,.b.s kbd,.b.gh kbd,kbd{color:var(--tx)}
kbd,.b.s kbd,.b.gh kbd{background:var(--ln);border-color:var(--bd);color:var(--mu)}

function cpfOk(c){c=digits(c);if(c.length!=11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);if(((s*10)%11)%10!=c[t])return false}return true}
function cnpjOk(c){c=digits(c);if(c.length!=14||/^(\d)\1+$/.test(c))return false;const dv=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return dv(12)==c[12]&&dv(13)==c[13]}
const docOk=v=>{const d=digits(v);return d.length==11?cpfOk(d):d.length==14?cnpjOk(d):false};

  for(let i=0;i<3;i++){o.frequency.linearRampToValueAtTime(1300,a+i*.8+.4);o.frequency.linearRampToValueAtTime(650,a+i*.8+.8)}

let LOCAL=false,LS=null;
const L={
  async get(p){const r=await fetch(p,{cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'HTTP '+r.status);return j},
  async post(p,b){
    const r=await fetch(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...(b||{}),token:OP&&OP.token})});const j=await r.json().catch(()=>({}));
    if(!r.ok){const m=j.error||'HTTP '+r.status;if(/^OPERADOR:/.test(m)){OP=null;localStorage.removeItem('pdvop');setTimeout(()=>opM(),50)}throw new Error(m)}

};
async function detectLocal(){try{const r=await fetch('/api/status',{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.local){LOCAL=true;LS=j;return j}}}catch(e){}return null}
const API={
  async login(email,password){
    if(LOCAL){try{LS=await L.post('/api/login',{email,password});return ''}catch(e){return e.message}}
    if(!await ensureSb())return 'Sem conexão com o servidor.';
    const {error}=await sb.auth.signInWithPassword({email,password});return error?'E-mail/WhatsApp ou senha incorretos.':'';

  async products(){if(LOCAL)return L.get('/api/products');const {data,error}=await sb.from('products').select('data');if(error)throw error;return data.map(r=>r.data).filter(Boolean)},

async function pollStatus(){if(!LOCAL)return;try{LS=await L.get('/api/status')}catch(e){LS=null}
  /* depois de uma atualização o servidor volta com outra versão: recarrega a tela sozinho (o carrinho fica guardado) quando não há janela aberta */
  if(LS&&LS.versao){if(!window.VER0)window.VER0=LS.versao;else if(LS.versao!=VER0&&!M&&!(typeof PG!='undefined'&&PG&&PG.mpw)){try{sessionStorage.setItem('mo-atualizou',LS.versao)}catch(e){}location.reload();return}}

  if(LS&&LS.needSetup){location.href='/configurar.html';return}

async function loadPend(){

async function init(){
  const st=await detectLocal();
  if(LOCAL){
    if(st.needSetup){location.href='/configurar.html';return}
    if(st.needLogin||!st.user)return loginView(st.lastErr&&!/internet/i.test(st.lastErr)?st.lastErr:'');
    user=st.user;
  }else{
    await ensureSb();
    if(!sb){$('#root').innerHTML='<div class="card login"><h3>Sem conexão</h3><p>Abra o PDV com internet pela primeira vez.</p></div>';return}
    let ses=null;try{ses=(await sb.auth.getSession()).data.session}catch(e){}
    if(!ses)return loginView();
    let ok=false;
    const {data,error}=await sb.rpc('sou_admin');
    if(error){ok=isNet(error)&&load('pdvadm','')==ses.user.id;if(!ok)return loginView('Não foi possível conferir sua conta. Verifique a internet.')}
    else ok=!!data;
    if(!ok){await sb.auth.signOut();return loginView('Essa conta não é administradora da loja.')}
    store('pdvadm',ses.user.id);user=ses.user;
  }
  shell();render();
  await Promise.all([loadCfg(),loadProducts()]);shell();render();
  loadPend();flushQ();checkAbertura();
  setInterval(()=>{if(!M&&!busy)loadProducts()},LOCAL?20000:60000);
  setInterval(loadPend,LOCAL?10000:20000);
  setInterval(flushQ,15000);
  if(LOCAL){setInterval(pollStatus,5000);await ensureOp()}
}

function autoriza(acao){
  return new Promise(res=>{
    if(!LOCAL||isGer())return res({n:opName()});
    if(semPin()){
      L.get('/api/ops').then(d=>{const gs=d.ops.filter(o=>o.nivel=='gerente');
        openM(`<h3>🔐 Autorização do gerente</h3><p class="mu" style="font-size:15px">${esc(acao)}</p><p class="mu">O gerente toca no próprio nome:</p><div class="opg">${gs.map(o=>`<button class="b s" onclick="autTap('${o.id}')">${esc(o.n)}<small>Gerente</small></button>`).join('')}</div><div class="mb"><button class="b s" onclick="closeM()"><kbd>Esc</kbd> Voltar</button></div>`,{onClose:()=>res(null)});
        window.autTap=async id=>{try{const r=await L.post('/api/op/auth',{id,acao});M.onClose=null;closeM(true);res({auth:r.auth,n:r.n})}catch(e){toast(e.message,'er')}};
      }).catch(()=>res(null));return;
    }
    openM(`<h3>🔐 Senha do gerente</h3><p class="mu" style="font-size:15px">${esc(acao)}</p><label>PIN do gerente</label><input id="gpin" type="password" inputmode="numeric" class="pgv" autofocus>
    <div class="mb"><button class="b s" onclick="closeM()"><kbd>Esc</kbd> Voltar</button><button class="b" id="gok"><kbd>Enter</kbd> Autorizar</button></div>`,{key:e=>{if(e.key=='Enter'){e.preventDefault();go()}},onClose:()=>res(null)});
    const go=async()=>{try{const r=await L.post('/api/op/auth',{pin:$('#gpin').value,acao});M.onClose=null;closeM(true);res({auth:r.auth,n:r.n})}catch(e){toast(e.message,'er');const i=$('#gpin');if(i){i.value='';i.focus()}}};
    $('#gok').onclick=go;
  });
}
/* chama o servidor; se ele pedir o gerente, pede a senha e tenta de novo */
async function comAuth(fn){
  try{return await fn(null)}catch(e){
    if(!/^GERENTE:/.test(e.message))throw e;
    const a=await autoriza(e.message.replace(/^GERENTE:\s*/,''));if(!a)throw new Error('Cancelado.');
    return fn(a.auth);
  }
}

function byCode(t){
  t=String(t).trim();if(!t)return null;
  const d=digits(t);
  return P.find(p=>p.bar&&String(p.bar).trim()==t)||P.find(p=>p.cod&&String(p.cod).trim()==t)
    ||(d&&d==t?P.find(p=>(p.bar&&digits(p.bar).replace(/^0+/,'')==d.replace(/^0+/,''))||(p.cod&&digits(p.cod)&&digits(p.cod).replace(/^0+/,'')==d.replace(/^0+/,''))):null)||null;
}
function scale(t){
  const B=C.bal;if(!B.on||!/^\d{13}$/.test(t)||!t.startsWith(B.pre))return null;
  const code=t.substr(B.ci,B.cl),val=parseInt(t.substr(B.vi,B.vl),10)/Math.pow(10,+B.dec||0);
  if(!code||isNaN(val)||val<=0)return null;
  const cn=parseInt(code,10);
  const p=P.find(x=>x.cod&&digits(x.cod)&&parseInt(digits(x.cod),10)==cn)||P.find(x=>x.bar&&digits(x.bar)==code);
  if(!p)return {miss:code};
  if(B.tipo=='peso')return {p,q:r3(val)};
  const pr=+p.p||0;return {p,q:pr?r3(val/pr):1,tot:r2(val)};
}
function search(t){
  const w=norm(t).split(/\s+/).filter(Boolean);if(!w.length)return [];
  const h=p=>norm(p.n+' '+(p.marca||'')+' '+(p.cod||'')+' '+(p.bar||'')+' '+(p.c||''));
  const st=norm(t);
  return P.filter(p=>{const s=h(p);return w.every(x=>s.includes(x))}).sort((a,b)=>(norm(b.n).startsWith(st)-norm(a.n).startsWith(st))||a.n.localeCompare(b.n,'pt-BR')).slice(0,12);
}
function sug(){

  sgList=search(t);sgSel=sgList.length?0:-1;drawSg();
}
function drawSg(){
  const g=$('#sg');if(!sgList.length){g.hidden=true;return}
  g.hidden=false;
  g.innerHTML=sgList.map((p,i)=>{const s=stk(p);return `<div class="${i==sgSel?'on':''}" onmousedown="event.preventDefault();pickSg(${i})"><span><b>${esc(p.n)}</b><br><small>${esc(p.cod?'cód. '+p.cod:'')}${p.bar?' · '+esc(p.bar):''}${s!==null?' · estoque '+N(s):''}</small>${s!==null&&s<=0?' <span class="z">SEM ESTOQUE</span>':''}</span><b class="num">${R(p.p)}<small> /${esc(p.u||'un')}</small></b></div>`}).join('');
  const on=g.querySelector('.on');if(on)on.scrollIntoView({block:'nearest'});
}
function hideSg(){sgList=[];sgSel=-1;const g=$('#sg');if(g)g.hidden=true}
function pickSg(i){const p=sgList[i];if(!p)return;const q=takeQ();clearIn();askWeight(p,q)}
function takeQ(){const m=/^(\d+(?:[.,]\d+)?)\s*[*xX]/.exec($('#in').value.trim());if(m)return num(m[1]);const q=mult;return q}
function clearIn(){const i=$('#in');if(i)i.value='';hideSg();mult=null;const m=$('#mt');if(m)m.hidden=true}
function setMult(q){mult=q;const m=$('#mt');m.hidden=false;m.textContent=N(q)+' ×'}
function askWeight(p,q){if(!q&&p.u=='kg')return qtyM(null,p);addP(p,q||1)}
function onEnter(){
  const i=$('#in');let t=i.value.trim();
  if(!t){if(cart.length)pagar();return}
  let q=mult;const m=/^(\d+(?:[.,]\d+)?)\s*[*xX]\s*(.*)$/.exec(t);
  if(m){q=num(m[1]);t=m[2].trim();if(!(q>0)){beepErr();return toast('Quantidade inválida.','er')}if(!t){i.value='';hideSg();setMult(q);return}}
  const sc=scale(t);
  if(sc&&sc.p){clearIn();addP(sc.p,sc.q,{tot:sc.tot});return}
  const p=byCode(t);
  if(p){clearIn();askWeight(p,q);return}
  if(sc&&sc.miss){beepErr();toast('Etiqueta de balança: produto de código '+sc.miss+' não cadastrado.','er');i.select();return}
  if(sgList.length&&sgSel>=0){const s=sgList[sgSel];clearIn();askWeight(s,q);return}
  const l=search(t);
  if(l.length==1){clearIn();askWeight(l[0],q);return}
  if(l.length){sgList=l;sgSel=0;drawSg();return}
  beepErr();
  if(LOCAL){clearIn();return naoCadM(t,q)}
  toast('Produto não encontrado: '+t,'er');i.select();
}
function addP(p,q=1,o={}){
  if(!p)return;
  q=r3(q);if(!(q>0))return;
  const s=stk(p);
  if(s!==null){const ja=cart.filter(l=>l.pid==p.id).reduce((a,l)=>a+l.q,0);if(ja+q>s)toast(`⚠️ ${p.n}: o sistema mostra ${N(s)} em estoque. Venda registrada mesmo assim — confira o estoque depois.`,'wn')}
  const last=cart[cart.length-1];
  const pr=o.p!=null?r2(o.p):(+p.p||0);
  if(o.tot==null&&last&&last.pid==p.id&&last.tot==null&&last.p==pr&&p.u!='kg'){last.q=r3(last.q+q);sel=cart.length-1}
  else{cart.push({k:uid(),pid:p.id,n:p.n,u:p.u||'un',p:pr,q,tot:o.tot??null,cod:p.cod||'',bar:p.bar||''});sel=cart.length-1}
  beepOk();render();focusIn();
}
function delLine(i){
  if(i==null)i=sel>=0?sel:cart.length-1;
  const l=cart[i];if(!l)return toast('Nenhum item para cancelar.');
  ask(`Cancelar o item ${i+1}?`,`<b>${esc(l.n)}</b><br>${N(l.q)} ${esc(l.u)} × ${R(l.p)} = ${R(lineTot(l))}`,async()=>{
    let a={n:opName()};if(regra('cancItem')){a=await autoriza('Cancelar o item '+l.n+' ('+R(lineTot(l))+')');if(!a)return}
    AUD.push({acao:'item cancelado',n:l.n,q:l.q,v:lineTot(l),por:opName(),aut:a.n,date:new Date().toISOString()});
    cart.splice(i,1);sel=Math.min(sel,cart.length-1);render();
  },{ok:'Cancelar item',danger:true});
}
function cancelSale(){
  if(!cart.length&&!ord&&!cli)return;
  ask(ord?'Soltar este pedido?':'Cancelar a venda inteira?',ord?'O pedido volta para a lista do app sem nenhuma alteração.':`${cart.length} item(ns) · ${R(total())}`,async()=>{
    if(!ord&&cart.length&&regra('cancItem')){const a=await autoriza('Cancelar a venda em andamento ('+R(total())+')');if(!a)return}
    resetSale();toast(ord?'Pedido solto.':'Venda cancelada.')},{ok:ord?'Soltar pedido':'Cancelar venda',danger:!ord});
}
function resetSale(){cart=[];AUD=[];sel=-1;disc={t:'v',v:0};cli=null;ord=null;mult=null;render();clearIn();focusIn()}

/* ===== modais ===== */
function openM(html,opt={}){
  if(M&&M.lock&&!opt.lock)return;
  if(M){M.onClose=null;closeM(true)}hideSg();
  const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md ${opt.cls||''}">${html}</div>`;
  o.addEventListener('mousedown',e=>{if(e.target==o&&!opt.sticky)closeM()});
  document.body.appendChild(o);M={el:o,key:opt.key,esc:opt.esc,lock:opt.lock,onClose:opt.onClose};
  setTimeout(()=>{const f=o.querySelector('[autofocus]')||o.querySelector('input:not([type=checkbox]),select');if(f){f.focus();if(f.select)f.select()}},30);
}
function closeM(silent){if(!M)return;const oc=M.onClose;M.el.remove();M=null;if(oc)oc();if(!silent)focusIn();else setTimeout(()=>{if(!M)focusIn()},0)}
function ask(t,body,yes,{ok='Confirmar',danger}={}){
  openM(`<h3>${t}</h3><div class="mu" style="font-size:15px;margin-top:6px">${body||''}</div><div class="mb"><button class="b s" onclick="closeM()"><kbd>Esc</kbd> Voltar</button><button class="b ${danger?'rd':''}" id="askY"><kbd>Enter</kbd> ${ok}</button></div>`,
    {key:e=>{if(e.key=='Enter'){e.preventDefault();closeM(true);yes()}}});

}

/* quantidade / preço do item */
function qtyLine(){
  const v=$('#in').value.trim();
  if(/^\d+(?:[.,]\d+)?$/.test(v)&&v.length<6&&num(v)>0){setMult(num(v));$('#in').value='';hideSg();toast('Quantidade '+v+' para o próximo item.');return}
  if(!cart.length)return toast('Digite a quantidade e aperte F3, ou use 3* antes do código.');
  qtyM(sel>=0?sel:cart.length-1);
}
function qtyM(i,prod){
  const l=i!=null?cart[i]:null,p=prod||(l&&P.find(x=>x.id==l.pid));
  const nm=l?l.n:p.n,u=l?l.u:(p.u||'un'),pr=l?l.p:+p.p;
  openM(`<h3>${l?'Alterar item':'Quantidade'}</h3><p class="mu">${esc(nm)}</p>
  <div class="g2"><div><label>Quantidade (${esc(u)})</label><input id="mq" class="pgv" inputmode="decimal" value="${l?String(l.q).replace('.',','):''}" placeholder="${u=='kg'?'0,000':'1'}" autofocus></div>
  <div><label>Preço unitário</label><input id="mp" class="pgv" inputmode="decimal" value="${f2(pr)}"></div></div>
  <p class="mu" id="mtot" style="text-align:right;font-size:16px"></p>
  ${LOCAL&&p?`<label class="ck"><input type="checkbox" id="msave"> Salvar como novo preço do produto (vale para as próximas vendas)</label>`:''}
  <div class="mb"><button class="b s" onclick="closeM()"><kbd>Esc</kbd> Voltar</button><button class="b" onclick="qtyOk()"><kbd>Enter</kbd> Confirmar</button></div>`,
  {key:e=>{if(e.key=='Enter'){e.preventDefault();qtyOk()}}});
  const up=()=>{const q=num($('#mq').value),pp=num($('#mp').value);$('#mtot').textContent=q>0&&pp>=0?'Total do item: '+R(r2(q*pp)):''};
  $('#mq').oninput=up;$('#mp').oninput=up;up();
  window.qtyOk=async()=>{
    const q=r3(num($('#mq').value)),pp=r2(num($('#mp').value)),salvar=$('#msave')&&$('#msave').checked,base=p?+p.p:pr;
    if(!(q>0))return toast('Informe a quantidade.','er');
    if(!(pp>=0))return toast('Preço inválido.','er');
    closeM(true);
    if(salvar&&pp!=base){
      try{await comAuth(auth=>L.post('/api/produto',{p:{id:p.id,p:pp},parcial:true,auth}));p.p=pp;toast('Novo preço de '+p.n+': '+R(pp));loadProducts()}catch(e){return toast(e.message,'er')}
    }else if(LOCAL&&pp<base&&regra('precoMenor')){
      const a=await autoriza('Vender '+nm+' por '+R(pp)+' (preço normal '+R(base)+')');if(!a)return;
      AUD.push({acao:'preço reduzido',n:nm,de:base,para:pp,por:opName(),aut:a.n,date:new Date().toISOString()});
    }
    if(l){const ch=q!=l.q||pp!=l.p;l.q=q;if(pp!=l.p)l.p=pp;if(ch)l.tot=null;render()}
    else addP(p,q,pp!=+p.p?{p:pp}:{});
  };
}

let mpTimer=null;
async function mpCobrar(k,tipo,parcelas){
  const v=k=='point'&&PG.mpv?PG.mpv:mpValor();if(!(v>0))return;PG.mpv=null;
  const W={k,v,tipo:tipo||'',parcelas:parcelas||1,st:'criando',msg:''};PG.mpw=W;mpDraw();
  try{
    const r=await L.post(k=='pix'?'/api/mp/pix':'/api/mp/point',{v,tipo,parcelas,ref:(ord?ord.id:'BALCAO')+'-'+Date.now().toString(36),cpf:cli&&cli.cpf||''});
    if(PG.mpw!==W)return;Object.assign(W,r,{st:'espera'});mpDraw();mpPoll(W);
  }catch(e){if(PG.mpw!==W)return;W.st='erro';W.msg=e.message;mpDraw()}
}
function mpPoll(W){
  clearTimeout(mpTimer);if(PG.mpw!==W||W.st!='espera')return;
  mpTimer=setTimeout(async()=>{
    if(PG.mpw!==W)return;
    try{
      const r=await L.post(W.k=='pix'?'/api/mp/pix/ver':'/api/mp/point/ver',{id:W.id});if(PG.mpw!==W)return;
      if(W.k=='pix'){
        if(r.st=='approved')return mpOk(W,{f:'Pix',mp:{k:'pix',id:W.id}});
        if(['rejected','cancelled','refunded'].includes(r.st)){W.st='erro';W.msg='O Pix foi '+(r.st=='cancelled'?'cancelado ou venceu':'recusado')+'.';return mpDraw()}
      }else{
        if(r.st=='processed'){const f=r.tipo||(W.tipo=='debito'?'Débito':'Crédito');return mpOk(W,{f,mp:{k:'point',id:W.id,pid:r.pagId,parcelas:r.parcelas,band:r.bandeira}})}
        if(r.st=='action_required'){W.msg='Confira na maquininha se o pagamento foi aprovado.';mpDraw()}
        else if(r.st=='at_terminal'&&!W.vist){W.vist=1;W.msg='A maquininha recebeu a cobrança. Peça o cartão ao cliente.';mpDraw()}
        if(['failed','canceled','expired','refunded'].includes(r.st)){W.st='erro';W.msg={failed:'Pagamento recusado'+(r.det&&r.det!='failed'?' ('+r.det.replace(/_/g,' ')+')':'')+'.',canceled:'Cobrança cancelada.',expired:'A cobrança venceu na maquininha.',refunded:'Pagamento devolvido.'}[r.st];return mpDraw()}
      }
    }catch(e){W.msg='Conferindo… ('+e.message+')';mpDraw()}
    mpPoll(W);
  },2000);
}

    const data={...base,items,sub:sub(),desc:descV(),taxa:taxa(),total:total(),pags,pay:forms.length==1?forms[0]:'Misto',cash,troco,st,done:st=='ent',fat,...(cli&&cli.cpf?{cpf:digits(cli.cpf)}:{}),...(AUD.length?{audit:AUD}:{}),...(pags.some(g=>g.f=='Fiado')&&cli?{cid_fiado:cli.id}:{})};

      else{busy=false;return alert('Não foi possível faturar: '+(res.error.message||res.error))}

const pdvDe=x=>x||'Caixa 1';
async function caixaDia(todos){
  const t0=hoje0(),d=await API.dia(),meu=C.pdv||'Caixa 1';
  const nomes=new Set([...d.mv.map(m=>pdvDe(m&&m.pdv)),...d.os.map(o=>pdvDe(o&&o.fat&&o.fat.pdv))]);
  const filtra=!todos&&CXT=='este'&&(nomes.size>1||(LS&&LS.caixaRede));
  const mv=d.mv.filter(m=>m&&new Date(m.date)>=t0&&(!filtra||pdvDe(m.pdv)==meu)).sort((x,y)=>String(x.date).localeCompare(String(y.date)));
  const todas=d.os.filter(o=>o&&o.fat&&new Date(o.fat.date)>=t0&&(!filtra||pdvDe(o.fat.pdv)==meu)).sort((a,b)=>String(b.fat.date).localeCompare(String(a.fat.date)));
  window._cxNomes=[...nomes];
  const os=todas.filter(o=>o.st!='canc'),canc=todas.filter(o=>o.st=='canc');
  const pay={},ops={};let din=0,fat=0;
  os.forEach(o=>{fat+=+o.total||0;const k=o.fat.op||'—';ops[k]=ops[k]||{n:0,v:0};ops[k].n++;ops[k].v+=+o.total||0;
    (o.pags||[]).forEach(g=>{pay[g.f]=pay[g.f]||{n:0,v:0};pay[g.f].n++;pay[g.f].v+=+g.v||0;if(g.f=='Dinheiro')din+=+g.v||0})});
  const fi=(d.fi||[]).filter(f=>f.tipo=='pagamento'),rf={};fi.forEach(f=>{rf[f.forma]=(rf[f.forma]||0)+(-f.valor)});
  const rfd=r2(rf.Dinheiro||0);
  const sm=t=>mv.filter(m=>m.tipo==t).reduce((s,m)=>s+(+m.valor||0),0);
  const ab=sm('abertura'),su=sm('suprimento'),sa=sm('sangria'),de=sm('despesa');
  return {mv,os,todas,canc,pay,ops,rf,rfd,din:r2(din),fat:r2(fat),ab,su,sa,de,gav:r2(ab+su+din+rfd-sa-de)};
}

async function addMov(){
  const v=r2(num($('#mvv').value));if(!(v>0))return toast('Informe o valor.','er');
  const t=$('#mvt').value,id=uid(),m={id,pdv:C.pdv,date:new Date().toISOString(),tipo:t,valor:v,desc:[$('#mvd').value.trim(),C.pdv].filter(Boolean).join(' · ')};

const bwCache={};
function bwLogo(src,th,lw){
  return new Promise(res=>{
    const k=String(src).slice(-60)+'|'+th+'|'+lw;if(bwCache[k])return res(bwCache[k]);
    const im=new Image();
    im.onload=()=>{
      const w=Math.max(120,Math.round(lw*8)),h=Math.round(im.height/im.width*w),c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      const d=x.getImageData(0,0,w,h),p=d.data,n=w*h,bg=new Uint8Array(n),st=[];
      const add=i=>{if(!bg[i]){bg[i]=1;st.push(i)}};
      for(let i=0;i<w;i++){add(i);add((h-1)*w+i)}for(let j=0;j<h;j++){add(j*w);add(j*w+w-1)}
      while(st.length){const i=st.pop(),xx=i%w,yy=(i-xx)/w;
        for(const j of [xx>0?i-1:-1,xx<w-1?i+1:-1,yy>0?i-w:-1,yy<h-1?i+w:-1]){if(j<0||bg[j])continue;if(Math.abs(p[i*4]-p[j*4])+Math.abs(p[i*4+1]-p[j*4+1])+Math.abs(p[i*4+2]-p[j*4+2])<24)add(j)}}
      const g=new Float32Array(n),off=th-165;
      for(let i=0;i<n;i++)g[i]=bg[i]?255:Math.max(0,Math.min(255,.299*p[i*4]+.587*p[i*4+1]+.114*p[i*4+2]-off));
      for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){const i=y*w+xx,o=g[i],v=o<128?0:255,e=o-v;g[i]=v;
        if(xx+1<w)g[i+1]+=e*7/16;if(y+1<h){if(xx>0)g[i+w-1]+=e*3/16;g[i+w]+=e*5/16;if(xx+1<w)g[i+w+1]+=e/16}}
      for(let i=0;i<n;i++){const v=g[i]<128?0:255;p[i*4]=p[i*4+1]=p[i*4+2]=v;p[i*4+3]=255}
      x.putImageData(d,0,0);try{bwCache[k]=c.toDataURL('image/png')}catch(e){bwCache[k]=''}res(bwCache[k]);
    };
    im.onerror=()=>res('');im.src=src;
  });
}

  if(h.pausa)return {aberto:false,pausa:true};

  let p;try{p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:h.tz||'America/Sao_Paulo',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d).map(x=>[x.type,x.value]))}catch(e){return {aberto:true,livre:true}}
  const dw=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday),m=(+p.hour%24)*60+(+p.minute),antes=+h.antes||0;
  const mm=x=>{const [a,b]=String(x).split(':');return (+a)*60+(+b||0)},ivs=k=>((h.d&&h.d[k])||[]).filter(i=>i&&i[0]&&i[1]);
  const hm=x=>{x=((x%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')};
  for(const [a,b] of ivs(dw)){const i=mm(a),f=mm(b);
    if(f>i&&m>=i&&m<f-antes)return {aberto:true,ate:hm(f-antes)};
    if(f<=i&&m>=i&&(1440-m)+f>antes)return {aberto:true,ate:hm(f-antes)}}
  for(const [a,b] of ivs((dw+6)%7)){const i=mm(a),f=mm(b);if(f<=i&&m<f-antes)return {aberto:true,ate:hm(f-antes)}}
  for(let k=0;k<8;k++){const dd=(dw+k)%7,l=ivs(dd).map(([a])=>mm(a)).filter(i=>k>0||i>m).sort((x,y)=>x-y);
    if(l.length)return {aberto:false,abre:(k==0?'hoje':k==1?'amanhã':DIAS[dd].toLowerCase())+' às '+hm(l[0])}}
  return {aberto:false,abre:''};
}

/* ===== Pix copia e cola + QR Code (mesmo padrão do app) ===== */
const ascii=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'');
const pixTxt=t=>ascii(t).toUpperCase().replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function pixKeyNorm(k,t){
  k=String(k||'').trim();const d=k.replace(/\D/g,'');
  if(t=='cpf')return d.length==11?d:'';if(t=='cnpj')return d.length==14?d:'';
  if(t=='cel'){const n=d.length>=12&&d.startsWith('55')?d.slice(2):d;return n.length==10||n.length==11?'+55'+n:''}
  if(t=='email')return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(k)&&k.length<=77?k.toLowerCase():'';
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(k)?k.toLowerCase():'';
}
function pixCode(o){
  const key=pixKeyNorm(EMP.pix,EMP.pixT||'cnpj');if(!key)return '';
  const nome=pixTxt(EMP.n).slice(0,25)||'LOJA',cid=pixTxt(String(EMP.c||'').split('/')[0]).slice(0,15)||'BRASIL';
  const val=r2(o.total||0),txid=('PED'+String(o.id).replace(/[^A-Za-z0-9]/g,'').slice(-10)).toUpperCase();
  const p='000201010211'+tlv('26',tlv('00','BR.GOV.BCB.PIX')+tlv('01',key))+'52040000'+'5303986'+(val>0?tlv('54',val.toFixed(2)):'')+'5802BR'+tlv('59',nome)+tlv('60',cid)+tlv('62',tlv('05',txid))+'6304';
  return p+crc16(p);
}
function qrSvg(q){const n=q.length,mg=4;let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q[r][c])d+=`M${c+mg} ${r+mg}h1v1h-1z`;return `<svg viewBox="0 0 ${n+2*mg} ${n+2*mg}" shape-rendering="crispEdges" role="img" aria-label="QR Code Pix"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
function qrMatrix(text){
  const data=Array.from(new TextEncoder().encode(text));
  const T=[null,[10,[[1,16]]],[16,[[1,28]]],[26,[[1,44]]],[18,[[2,32]]],[24,[[2,43]]],[16,[[4,27]]],[18,[[4,31]]],[22,[[2,38],[2,39]]],[22,[[3,36],[2,37]]],[26,[[4,43],[1,44]]],[30,[[1,50],[4,51]]],[22,[[6,36],[2,37]]],[22,[[8,37],[1,38]]],[24,[[4,40],[5,41]]]];
  const AP=[null,[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50],[6,30,54],[6,32,58],[6,34,62],[6,26,46,66]];
  let v=1;for(;v<=14;v++){const cap=T[v][1].reduce((s,[k,d])=>s+k*d,0);if(4+(v<10?8:16)+data.length*8<=cap*8)break}
  if(v>14)return null;
  const [ecn,blk]=T[v],total=blk.reduce((s,[k,d])=>s+k*d,0);
  const bb=[],put=(val,len)=>{for(let i=len-1;i>=0;i--)bb.push((val>>i)&1)};
  put(4,4);put(data.length,v<10?8:16);data.forEach(b=>put(b,8));
  put(0,Math.min(4,total*8-bb.length));while(bb.length%8)bb.push(0);
  const cw=[];for(let i=0;i<bb.length;i+=8)cw.push(parseInt(bb.slice(i,i+8).join(''),2));
  for(let p=0;cw.length<total;p^=1)cw.push(p?0x11:0xEC);
  const exp=[],log=[];let x=1;
  for(let i=0;i<255;i++){exp[i]=x;log[x]=i;x<<=1;if(x&256)x^=0x11D}
  for(let i=255;i<512;i++)exp[i]=exp[i-255];
  const mul=(a,b)=>a&&b?exp[log[a]+log[b]]:0;
  let g=[1];
  for(let i=0;i<ecn;i++){const ng=new Array(g.length+1).fill(0);for(let j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=mul(g[j],exp[i])}g=ng}
  const rs=d=>{const r=new Array(ecn).fill(0);for(const b of d){const f=b^r[0];r.shift();r.push(0);if(f)for(let j=0;j<ecn;j++)r[j]^=mul(g[j+1],f)}return r};
  const blocks=[];let p0=0;
  for(const [k,d] of blk)for(let i=0;i<k;i++){blocks.push(cw.slice(p0,p0+d));p0+=d}
  const ecs=blocks.map(rs),out=[],maxd=Math.max(...blocks.map(b=>b.length));
  for(let i=0;i<maxd;i++)blocks.forEach(b=>{if(i<b.length)out.push(b[i])});
  for(let i=0;i<ecn;i++)ecs.forEach(e=>out.push(e[i]));
  const fb=[];out.forEach(b=>{for(let i=7;i>=0;i--)fb.push((b>>i)&1)});
  const n=17+4*v,M=Array.from({length:n},()=>new Array(n).fill(0)),F=Array.from({length:n},()=>new Array(n).fill(false));
  const set=(r,c,val)=>{M[r][c]=val?1:0;F[r][c]=true};
  const finder=(r0,c0)=>{for(let dr=-1;dr<=7;dr++)for(let dc=-1;dc<=7;dc++){const r=r0+dr,c=c0+dc;if(r<0||c<0||r>=n||c>=n)continue;set(r,c,dr>=0&&dr<=6&&dc>=0&&dc<=6&&(dr==0||dr==6||dc==0||dc==6||(dr>=2&&dr<=4&&dc>=2&&dc<=4)))}};
  finder(0,0);finder(0,n-7);finder(n-7,0);
  for(let i=8;i<n-8;i++){set(6,i,i%2==0);set(i,6,i%2==0)}
  const ap=AP[v],last=ap[ap.length-1];
  for(const r of ap)for(const c of ap){if((r==6&&c==6)||(r==6&&c==last)||(r==last&&c==6))continue;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++)set(r+dr,c+dc,Math.max(Math.abs(dr),Math.abs(dc))!=1)}
  for(let i=0;i<9;i++){if(i!=6){F[8][i]=true;F[i][8]=true}}
  for(let i=0;i<8;i++){F[8][n-1-i]=true;F[n-1-i][8]=true}
  set(n-8,8,1);
  if(v>=7){for(let i=0;i<6;i++)for(let j=0;j<3;j++){F[i][n-11+j]=true;F[n-11+j][i]=true}}
  let bi=0;
  for(let c=n-1,up=true;c>0;c-=2,up=!up){if(c==6)c=5;for(let i=0;i<n;i++){const r=up?n-1-i:i;for(let k=0;k<2;k++){const cc=c-k;if(!F[r][cc])M[r][cc]=bi<fb.length?fb[bi++]:0}}}
  const maskFn=[(r,c)=>(r+c)%2==0,(r,c)=>r%2==0,(r,c)=>c%3==0,(r,c)=>(r+c)%3==0,(r,c)=>(Math.floor(r/2)+Math.floor(c/3))%2==0,(r,c)=>(r*c)%2+(r*c)%3==0,(r,c)=>((r*c)%2+(r*c)%3)%2==0,(r,c)=>(((r+c)%2)+(r*c)%3)%2==0];
  const withMask=mk=>{
    const m=M.map(row=>row.slice());
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(!F[r][c]&&maskFn[mk](r,c))m[r][c]^=1;
    let rem=mk<<10;for(let i=14;i>=10;i--)if((rem>>i)&1)rem^=0x537<<(i-10);
    const bits=((mk<<10)|rem)^0x5412,b=i=>(bits>>i)&1;
    for(let i=0;i<=5;i++)m[i][8]=b(i);
    m[7][8]=b(6);m[8][8]=b(7);m[8][7]=b(8);
    for(let i=9;i<15;i++)m[8][14-i]=b(i);
    for(let i=0;i<8;i++)m[8][n-1-i]=b(i);
    for(let i=8;i<15;i++)m[n-15+i][8]=b(i);
    m[n-8][8]=1;
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>11)*0x1F25);const vb=(v<<12)|r;for(let i=0;i<18;i++){const bit=(vb>>i)&1,a=n-11+i%3,q=Math.floor(i/3);m[q][a]=bit;m[a][q]=bit}}
    return m;
  };
  const penalty=m=>{
    let pen=0,dark=0;
    const line=get=>{let run=1,prev=get(0),s=''+prev;for(let i=1;i<n;i++){const cur=get(i);s+=cur;if(cur==prev)run++;else{if(run>=5)pen+=3+run-5;run=1;prev=cur}}if(run>=5)pen+=3+run-5;for(let i=0;i+11<=n;i++){const w=s.substr(i,11);if(w=='10111010000'||w=='00001011101')pen+=40}};
    for(let r=0;r<n;r++){line(i=>m[r][i]);line(i=>m[i][r]);for(let c=0;c<n;c++){dark+=m[r][c];if(r<n-1&&c<n-1&&m[r][c]==m[r][c+1]&&m[r][c]==m[r+1][c]&&m[r][c]==m[r+1][c+1])pen+=3}}
    pen+=(Math.ceil(Math.abs(dark*20-n*n*10)/(n*n))-1)*10;return pen;
  };
  let best=null,bp=1e9;for(let mk=0;mk<8;mk++){const m=withMask(mk),pn=penalty(m);if(pn<bp){bp=pn;best=m}}
  return best;
}
